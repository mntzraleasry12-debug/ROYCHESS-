<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>شطرنج الوحوش - اللعب</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0a0a0a; color: white; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }

    /* شريط الحالة العلوي */
    #top-bar { position: absolute; top: 0; width: 100%; padding: 15px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); z-index: 100; border-bottom: 1px solid #333; }
    #status { color: #ffd700; font-weight: bold; font-size: 16px; text-shadow: 0 0 10px #d4af37; }
    .btn { background: linear-gradient(to bottom, #444, #111); color: white; border: 1px solid #555; padding: 8px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; }
    .btn:active { transform: scale(0.95); }

    /* حاوية الرقعة */
    #board-wrapper {
        position: relative;
        width: 96vw; 
        max-width: 550px;
        aspect-ratio: 1 / 1; 
        
        /* ✅ اسم صورتك مثبت هنا */
        background-image: url('board.png.jpg'); 
        
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 10px;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
        margin-top: 50px; 
    }

    /* الشبكة الشفافة */
    #board {
        position: absolute;
        top: 27.2%; 
        left: 2%;
        width: 96%; 
        aspect-ratio: 1 / 1; 
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
    }

    .square {
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; position: relative;
        border-radius: 4px;
    }

    .selected { background-color: rgba(255, 215, 0, 0.4) !important; box-shadow: inset 0 0 15px #ffd700; }
    .valid-move::after {
        content: ''; position: absolute; width: 30%; height: 30%;
        background-color: rgba(0, 255, 0, 0.6); border-radius: 50%; box-shadow: 0 0 10px #0f0;
    }
    .valid-capture::after {
        content: ''; position: absolute; width: 85%; height: 85%;
        border: 4px solid rgba(255, 0, 0, 0.8); border-radius: 50%; box-shadow: 0 0 15px #f00;
    }

    .piece {
        font-size: 9vw; 
        max-font-size: 55px;
        z-index: 5;
        line-height: 1;
        transition: transform 0.1s;
    }
    .piece:active { transform: scale(0.9); }

    .piece-w { color: #ffffff; text-shadow: 0 2px 2px rgba(0,0,0,0.9), 0 0 10px rgba(255, 255, 255, 0.5); }
    .piece-b { color: #1a1a1a; text-shadow: 0 2px 2px rgba(255,255,255,0.4), 0 0 10px rgba(0, 0, 0, 0.8); }

    .panel { position: absolute; bottom: 15px; width: 90%; max-width: 500px; display: flex; justify-content: space-between; gap: 10px; z-index: 10; }
    select { padding: 10px; border-radius: 8px; background: #222; color: #fff; border: 1px solid #555; font-weight: bold; }

    #win-screen { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200; flex-direction: column; justify-content: center; align-items: center; }
    #win-screen h1 { color: #ffd700; font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 20px #d4af37; }
</style>
</head>
<body>

    <div id="top-bar">
        <div id="status">دورك (الأبيض)</div>
        <!-- ✅ هذا الزر يرجعك لملف index.html -->
        <button class="btn" onclick="window.location.href='index.html'">خروج 🚪</button>
    </div>

    <div id="board-wrapper">
        <div id="board"></div>
    </div>

    <div class="panel">
        <select id="level">
            <option value="easy">🟢 سهل</option>
            <option value="hard">🔴 صعب</option>
        </select>
        <button class="btn" onclick="restartGame()">🔄 لعبة جديدة</button>
        <button class="btn" onclick="undoMove()">↩ تراجع</button>
    </div>

    <div id="win-screen">
        <h1 id="win-title">🏆 فوز!</h1>
        <button class="btn" style="font-size: 20px; padding: 15px 30px;" onclick="restartGame()">العب مرة أخرى</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>

    <script>
        const game = new Chess();
        let selectedSquare = null;
        let isThinking = false;

        const symbols = {
            'wp': '♙', 'wn': '♘', 'wb': '♗', 'wr': '♖', 'wq': '♕', 'wk': '♔',
            'bp': '♟', 'bn': '♞', 'bb': '♝', 'br': '♜', 'bq': '♛', 'bk': '♚'
        };

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode(97 + c); 
                    const rank = 8 - r;
                    const squareName = file + rank;

                    const squareDiv = document.createElement('div');
                    squareDiv.className = 'square';
                    squareDiv.dataset.square = squareName;

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        const pieceKey = piece.color + piece.type;
                        pieceSpan.textContent = symbols[pieceKey];
                        pieceSpan.className = 'piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
                        squareDiv.appendChild(pieceSpan);
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateHighlights();
        }

        function handleSquareClick(square) {
            if (isThinking || game.game_over() || game.turn() !== 'w') return;

            const piece = game.get(square);

            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                }
                return;
            }

            const moves = game.moves({ square: selectedSquare, verbose: true });
            const move = moves.find(m => m.to === square);

            if (move) {
                game.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                renderBoard();
                
                if (checkGameOver()) return;

                isThinking = true;
                document.getElementById('status').textContent = 'الكمبيوتر يفكر...';
                setTimeout(makeComputerMove, 300);
            } else {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        }

        function updateHighlights() {
            document.querySelectorAll('.square').forEach(sq => sq.classList.remove('selected', 'valid-move', 'valid-capture'));
            if (!selectedSquare) return;

            const selectedDiv = document.querySelector(`[data-square="${selectedSquare}"]`);
            if (selectedDiv) selectedDiv.classList.add('selected');

            const moves = game.moves({ square: selectedSquare, verbose: true });
            moves.forEach(m => {
                const targetDiv = document.querySelector(`[data-square="${m.to}"]`);
                if (targetDiv) {
                    if (m.flags.includes('c') || m.flags.includes('e')) {
                        targetDiv.classList.add('valid-capture');
                    } else {
                        targetDiv.classList.add('valid-move');
                    }
                }
            });
        }

        function makeComputerMove() {
            const moves = game.moves();
            if (moves.length === 0) return;

            let bestMove = null;
            let bestValue = -9999;
            const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };
            const isHard = document.getElementById('level').value === 'hard';

            moves.forEach(move => {
                game.move(move);
                let boardValue = 0;
                
                game.board().forEach(row => {
                    row.forEach(piece => {
                        if (piece) {
                            let val = pieceValues[piece.type];
                            boardValue += piece.color === 'b' ? val : -val;
                        }
                    });
                });
                game.undo();

                if (!isHard) boardValue += Math.random() * 50; 

                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            });

            game.move(bestMove);
            isThinking = false;
            selectedSquare = null;
            renderBoard();
            checkGameOver();
        }

        function checkGameOver() {
            const winScreen = document.getElementById('win-screen');
            const winTitle = document.getElementById('win-title');

            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'الأسود' : 'الأبيض';
                document.getElementById('status').textContent = `كش مات! ${winner} فاز`;
                winTitle.textContent = game.turn() === 'w' ? '💀 خسارة' : '🏆 فوز ساحق!';
                winTitle.style.color = game.turn() === 'w' ? '#ff4d4d' : '#ffd700';
                winScreen.style.display = 'flex';
                return true;
            } else if (game.in_draw()) {
                document.getElementById('status').textContent = 'تعادل!';
                winTitle.textContent = '🤝 تعادل';
                winScreen.style.display = 'flex';
                return true;
            } else if (game.in_check()) {
                document.getElementById('status').textContent = game.turn() === 'w' ? '⚠️ كش! دورك' : '⚠️ كش! الكمبيوتر';
            } else {
                document.getElementById('status').textContent = game.turn() === 'w' ? 'دورك (الأبيض)' : 'الكمبيوتر...';
            }
            return false;
        }

        function restartGame() {
            game.reset();
            selectedSquare = null;
            isThinking = false;
            document.getElementById('win-screen').style.display = 'none';
            renderBoard();
            checkGameOver();
        }

        function undoMove() {
            if (isThinking || game.history().length < 2) return;
            game.undo();
            game.undo();
            selectedSquare = null;
            renderBoard();
            checkGameOver();
        }

        restartGame();
    </script>
</body>
</html>
