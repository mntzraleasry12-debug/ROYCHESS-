<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج 3D - 2D Pieces</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <!-- استدعاء مكتبة قوانين الشطرنج -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.2/chess.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111;
        }

        /* ================= واجهة القائمة (Menu) ================= */
        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            /* ربط صورة القائمة هنا */
            background-image: url('menu.png');
            background-size: cover;
            background-position: center;
            z-index: 10;
            transition: opacity 0.5s;
        }

        /* المناطق الشفافة القابلة للنقر فوق الصورة */
        .click-zone {
            position: absolute;
            cursor: pointer;
            border-radius: 15px;
            transition: 0.2s;
        }
        .click-zone:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }

        .btn-settings-zone { top: 2%; left: 3%; width: 12%; height: 8%; }
        .btn-friends-zone { bottom: 5%; left: 4%; width: 44%; height: 18%; }
        .btn-cpu-zone { bottom: 5%; right: 4%; width: 44%; height: 18%; }

        /* ================= شاشة اللعب ================= */
        #game-screen {
            display: none;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #2c3e50, #000000);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1200px; /* سر تأثير 3D */
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            position: absolute;
            top: 0;
            color: white;
            z-index: 5;
        }

        .back-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
        }

        .turn-indicator {
            background: rgba(0,0,0,0.6);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #ffcc00;
            color: #ffcc00;
            font-weight: bold;
        }

        /* قاعدة الشطرنج 3D */
        .board-container {
            width: 90vw;
            max-width: 500px;
            aspect-ratio: 1 / 1;
            transform: rotateX(35deg); /* ميلان اللوحة */
            transform-style: preserve-3d;
            box-shadow: 0 30px 50px rgba(0,0,0,0.8), 0 0 0 15px #5c3a21; /* إطار خشبي */
            border: 2px solid #3e2716;
            transition: transform 0.5s ease;
        }

        .board {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            position: relative;
        }

        .square {
            width: 100%; height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .square.light { background-color: #f0d9b5; }
        .square.dark { background-color: #b58863; }
        
        .square.highlight { background-color: rgba(255, 255, 0, 0.6) !important; }
        .square.valid-move::after {
            content: '';
            width: 30%; height: 30%;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 50%;
            position: absolute;
        }

        /* القطع 2D */
        .piece {
            font-size: 4vmin;
            cursor: pointer;
            transition: transform 0.2s;
            z-index: 2;
            /* عكس الميلان لتبدو القطعة واقفة ومسطحة */
            transform: rotateX(-35deg) translateY(-5px);
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .piece.white { color: #ffffff; text-shadow: 0 0 2px #000, 2px 2px 4px #000; }
        .piece.black { color: #222222; text-shadow: 0 0 2px #fff, 2px 2px 4px #000; }
        
        .piece:hover { transform: rotateX(-35deg) translateY(-10px) scale(1.1); }

        /* ================= قائمة الإعدادات ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .settings-modal {
            background: #1a1a1a;
            border: 3px solid #ffcc00;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            padding: 25px;
            color: white;
            text-align: center;
        }

        .settings-modal h2 { color: #ffcc00; margin-bottom: 20px; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #ffcc00; }
        input:checked + .slider:before { transform: translateX(24px); }

        .close-btn {
            background: #ffcc00; color: #000; border: none; padding: 12px;
            font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%;
        }

    </style>
</head>
<body>

    <!-- واجهة القائمة الرئيسية -->
    <div id="menu-screen">
        <div class="click-zone btn-settings-zone" onclick="openSettings()"></div>
        <div class="click-zone btn-friends-zone" onclick="startGame('friend')"></div>
        <div class="click-zone btn-cpu-zone" onclick="startGame('cpu')"></div>
    </div>

    <!-- شاشة اللعب -->
    <div id="game-screen">
        <div class="top-bar">
            <button class="back-btn" onclick="goToMenu()">رجوع</button>
            <div class="turn-indicator" id="turn-text">دور الأبيض</div>
        </div>
        
        <div class="board-container">
            <div class="board" id="chessboard"></div>
        </div>
    </div>

    <!-- قائمة الإعدادات -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <h2>⚙️ الإعدادات</h2>
            
            <div class="setting-item">
                <label>الموسيقى</label>
                <label class="switch">
                    <input type="checkbox" id="musicToggle" checked onchange="toggleMusic(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label>صوت النقر</label>
                <label class="switch">
                    <input type="checkbox" id="sfxToggle" checked onchange="toggleSFX(this)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item" style="flex-direction: column; align-items: flex-start; border: none;">
                <label style="margin-bottom: 10px;">زاوية الكاميرا (3D)</label>
                <select id="angleSelect" style="width: 100%; padding: 10px; border-radius: 8px;" onchange="changeAngle(this.value)">
                    <option value="35" selected>مائل (افتراضي)</option>
                    <option value="0">من الأعلى (2D)</option>
                    <option value="55">زاوية حادة</option>
                </select>
            </div>

            <button class="close-btn" onclick="closeSettings()">حفظ وإغلاق</button>
        </div>
    </div>

    <script>
        // --- إعدادات اللعبة الأساسية ---
        let game = new Chess();
        let boardElement = document.getElementById('chessboard');
        let selectedSquare = null;
        let gameMode = 'friend'; // 'friend' أو 'cpu'
        let sfxEnabled = true;
        let isAiThinking = false;

        // رموز القطع (2D)
        const pieces = {
            'p': '♟', 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', // أسود
            'P': '♙', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔'  // أبيض
        };

        // دالة رسم اللوحة والقطع
        function drawBoard() {
            boardElement.innerHTML = '';
            const board = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = String.fromCharCode(97 + c) + (8 - r);
                    const squareDiv = document.createElement('div');
                    squareDiv.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
                    squareDiv.dataset.square = squareId;
                    
                    // إضافة القطع
                    const piece = board[r][c];
                    if (piece) {
                        const pieceDiv = document.createElement('div');
                        let pieceCode = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;
                        pieceDiv.className = `piece ${piece.color === 'w' ? 'white' : 'black'}`;
                        pieceDiv.innerHTML = pieces[pieceCode];
                        pieceDiv.dataset.piece = pieceCode;
                        squareDiv.appendChild(pieceDiv);
                    }

                    squareDiv.addEventListener('click', () => onSquareClick(squareId));
                    boardElement.appendChild(squareDiv);
                }
            }
        }

        // دالة النقر على المربعات (حركة القطع)
        function onSquareClick(square) {
            if (isAiThinking) return;
            playClickSound();

            if (selectedSquare) {
                // محاولة تحريك القطعة
                let move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q' // ترقية البيدق دائماً لملكة
                });

                if (move) {
                    selectedSquare = null;
                    drawBoard();
                    updateTurnIndicator();
                    checkGameOver();

                    // إذا كان ضد الكمبيوتر ودور الأسود
                    if (gameMode === 'cpu' && game.turn() === 'b' && !game.game_over()) {
                        isAiThinking = true;
                        setTimeout(makeAIMove, 500); // تأخير لتبدو كأنها تفكر
                    }
                } else {
                    // إذا كانت الحركة غير صحيحة، قم بإلغاء التحديد أو تحديد قطعة أخرى
                    const piece = game.get(square);
                    if (piece && piece.color === game.turn()) {
                        selectedSquare = square;
                        highlightMoves(square);
                    } else {
                        selectedSquare = null;
                        clearHighlights();
                    }
                }
            } else {
                // تحديد قطعة
                const piece = game.get(square);
                if (piece && piece.color === game.turn()) {
                    selectedSquare = square;
                    highlightMoves(square);
                }
            }
        }

        // إبراز الحركات المتاحة
        function highlightMoves(square) {
            clearHighlights();
            document.querySelector(`[data-square="${square}"]`).classList.add('highlight');
            
            const moves = game.moves({ square: square, verbose: true });
            moves.forEach(move => {
                const sq = document.querySelector(`[data-square="${move.to}"]`);
                if (sq) sq.classList.add('valid-move');
            });
        }

        function clearHighlights() {
            document.querySelectorAll('.highlight').forEach(el => el.classList.remove('highlight'));
            document.querySelectorAll('.valid-move').forEach(el => el.classList.remove('valid-move'));
        }

        // تحديث مؤشر الدور
        function updateTurnIndicator() {
            document.getElementById('turn-text').innerText = game.turn() === 'w' ? 'دور الأبيض ♔' : 'دور الأسود ♚';
        }

        // التحقق من نهاية اللعبة
        function checkGameOver() {
            if (game.in_checkmate()) {
                setTimeout(() => alert(game.turn() === 'w' ? 'كش مات! فاز الأسود 🏆' : 'كش مات! فاز الأبيض 🏆'), 100);
            } else if (game.in_draw()) {
                setTimeout(() => alert('انتهت اللعبة بالتعادل!'), 100);
            }
        }

        // --- الذكاء الاصطناعي (ضد الكمبيوتر) ---
        function makeAIMove() {
            // خوارزمية بسيطة (تختار حركة عشوائية صحيحة من الحركات المتاحة)
            const possibleMoves = game.moves();
            if (possibleMoves.length === 0) return;
            
            const randomIndex = Math.floor(Math.random() * possibleMoves.length);
            const move = possibleMoves[randomIndex];
            
            game.move(move);
            drawBoard();
            updateTurnIndicator();
            checkGameOver();
            isAiThinking = false;
        }

        // --- التنقل بين الشاشات ---
        function startGame(mode) {
            playClickSound();
            gameMode = mode;
            game = new Chess(); // تصفير اللعبة
            selectedSquare = null;
            
            document.getElementById('menu-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('menu-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'flex';
                drawBoard();
                updateTurnIndicator();
            }, 500);
        }

        function goToMenu() {
            playClickSound();
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('menu-screen').style.display = 'block';
            setTimeout(() => document.getElementById('menu-screen').style.opacity = '1', 50);
        }

        // --- الإعدادات والصوتيات ---
        function openSettings() { playClickSound(); document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { playClickSound(); document.getElementById('settingsModal').style.display = 'none'; }
        
        function toggleMusic(el) { playClickSound(); console.log('Music:', el.checked); }
        function toggleSFX(el) { sfxEnabled = el.checked; playClickSound(); }
        
        // تغيير زاوية الكاميرا
        function changeAngle(angle) {
            playClickSound();
            const board = document.querySelector('.board-container');
            const piecesElements = document.querySelectorAll('.piece');
            
            // تغيير ميلان اللوحة
            board.style.transform = `rotateX(${angle}deg)`;
            
            // عكس الميلان للقطع لتبدو واقفة
            let reverseAngle = -parseInt(angle);
            piecesElements.forEach(p => p.style.transform = `rotateX(${reverseAngle}deg) translateY(-5px)`);
        }

        // تأثير صوت النقر (وهمي)
        function playClickSound() {
            if (!sfxEnabled) return;
            // يمكنك هنا وضع كود تشغيل ملف صوتي حقيقي إذا أردت
            // let audio = new Audio('click.mp3'); audio.play();
            console.log('🔉 click');
        }
    </script>
</body>
</html>
