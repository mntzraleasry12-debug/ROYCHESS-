<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>شطرنج الوحوش — لوحات زيتية 3D</title>
<style>
  :root{
    --gold:#ffd166; --violet:#7209b7; --pink:#f72585; --teal:#06d6a0; --deep:#120a22;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:#fff;
    font-family:"Segoe UI","Tahoma",system-ui,sans-serif; user-select:none;}
  #scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab;}
  #scene:active{cursor:grabbing;}

  /* ============ HUD ============ */
  #hud{position:fixed;top:0;left:0;right:0;padding:14px 18px;display:flex;gap:12px;
       align-items:center;justify-content:space-between;pointer-events:none;z-index:6;}
  .pill{
    display:flex;align-items:center;gap:10px;padding:9px 18px;border-radius:999px;
    background:rgba(24,12,46,.72);border:1px solid rgba(255,209,102,.35);
    backdrop-filter:blur(10px);font-weight:700;font-size:15px;letter-spacing:.3px;
    box-shadow:0 6px 24px rgba(0,0,0,.45);
  }
  .dot{width:14px;height:14px;border-radius:50%;background:var(--gold);
       box-shadow:0 0 14px var(--gold);transition:.3s;}
  .dot.black{background:var(--violet);box-shadow:0 0 14px #c77dff;}
  #statusText{color:var(--gold);font-size:14px;font-weight:600;opacity:.9;}
  #menuBtn{
    pointer-events:auto;cursor:pointer;padding:9px 18px;border-radius:999px;
    background:rgba(24,12,46,.72);border:1px solid rgba(255,209,102,.35);
    color:#fff;font-family:inherit;font-weight:700;font-size:14px;backdrop-filter:blur(10px);
    transition:.2s;
  }
  #menuBtn:hover{background:rgba(114,9,183,.8);border-color:var(--gold);}

  /* ============ قائمة البداية ============ */
  .screen{
    position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
    overflow:hidden;transition:opacity .45s ease, visibility .45s;
  }
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .menu-art{
    position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
    filter:saturate(1.25) contrast(1.05) brightness(.75);
    animation:slowzoom 26s ease-in-out infinite alternate;
  }
  @keyframes slowzoom{from{transform:scale(1.02)}to{transform:scale(1.14)}}
  .menu-veil{
    position:absolute;inset:0;
    background:
      radial-gradient(circle at 50% 45%, rgba(114,9,183,.25), rgba(10,4,20,.92) 70%),
      linear-gradient(160deg, rgba(247,37,133,.22), rgba(6,214,160,.14));
  }
  .menu-panel{
    position:relative;z-index:2;text-align:center;padding:44px 46px;border-radius:28px;
    background:rgba(18,8,34,.72);border:1px solid rgba(255,209,102,.28);
    backdrop-filter:blur(18px);box-shadow:0 30px 90px rgba(0,0,0,.65);
    max-width:min(92vw,560px);
  }
  .menu-panel h1{
    margin:0 0 10px;font-size:clamp(30px,6vw,52px);letter-spacing:1px;
    background:linear-gradient(100deg,#ffd166,#f72585 45%,#06d6a0 90%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px rgba(247,37,133,.45));
  }
  .menu-panel p{margin:0 0 30px;color:#d7c9f5;font-size:15px;line-height:1.8;opacity:.9;}
  .btns{display:flex;flex-direction:column;gap:14px;}
  .btn{
    cursor:pointer;padding:16px 26px;border-radius:16px;border:1px solid rgba(255,209,102,.35);
    background:linear-gradient(135deg, rgba(114,9,183,.55), rgba(58,12,163,.55));
    color:#fff;font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.5px;
    transition:transform .18s, box-shadow .18s, background .18s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 12px 34px rgba(247,37,133,.35);
    background:linear-gradient(135deg, rgba(247,37,133,.65), rgba(114,9,183,.7));}
  .btn.primary{
    background:linear-gradient(135deg,#ffd166,#f72585);color:#2a0a3a;
    border-color:#ffd166;box-shadow:0 10px 34px rgba(255,209,102,.35);
  }
  .btn.primary:hover{box-shadow:0 16px 44px rgba(255,209,102,.5);}

  /* ============ نافذة الترقية ============ */
  #promoBox{
    position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    background:rgba(8,3,18,.78);backdrop-filter:blur(8px);
  }
  #promoBox.show{display:flex;}
  .promo-card{
    padding:28px 32px;border-radius:24px;text-align:center;
    background:rgba(24,12,46,.95);border:1px solid rgba(255,209,102,.35);
    box-shadow:0 30px 80px rgba(0,0,0,.7);
  }
  .promo-card h3{margin:0 0 20px;color:var(--gold);font-size:19px;}
  .promo-row{display:flex;gap:14px;}
  .promo-row button{
    width:78px;height:78px;border-radius:18px;cursor:pointer;font-size:32px;
    background:linear-gradient(135deg,rgba(114,9,183,.7),rgba(247,37,133,.5));
    border:1px solid rgba(255,209,102,.4);color:#fff;transition:.18s;
  }
  .promo-row button:hover{transform:translateY(-3px) scale(1.06);border-color:var(--gold);}

  /* ============ شارة النهاية ============ */
  #banner{
    position:fixed;inset:0;z-index:25;display:none;align-items:center;justify-content:center;
    pointer-events:none;
  }
  #banner.show{display:flex;}
  #banner .inner{
    padding:30px 54px;border-radius:24px;font-size:clamp(26px,5vw,42px);font-weight:900;
    background:rgba(18,8,34,.9);border:2px solid var(--gold);color:var(--gold);
    box-shadow:0 0 70px rgba(255,209,102,.5);text-shadow:0 0 24px rgba(255,209,102,.7);
    animation:pop .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  @media(max-width:520px){
    .menu-panel{padding:32px 24px;}
    .pill{padding:7px 13px;font-size:13px;}
    #hud{padding:10px;}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<!-- ================= HUD ================= -->
<div id="hud">
  <div class="pill">
    <span class="dot" id="turnDot"></span>
    <span id="turnText">دور الأبيض</span>
  </div>
  <div class="pill" id="statusText">—</div>
  <button id="menuBtn">القائمة</button>
</div>

<!-- ================= القائمة ================= -->
<div class="screen" id="menu">
  <img src="menu.png" alt="" class="menu-art"
       onerror="this.style.display='none'">
  <div class="menu-veil"></div>
  <div class="menu-panel">
    <h1>شطرنج الوحوش</h1>
    <p>قطعٌ من عالمٍ آخر… مرسومةٌ بضربات الفرشاة الزيتية<br>ألوانٌ زاهية ووحوشٌ لا وجود لها</p>
    <div class="btns">
      <button class="btn primary" data-mode="pvp">لاعب ضد لاعب</button>
      <button class="btn" data-mode="pve">لاعب ضد الحاسوب</button>
    </div>
  </div>
</div>

<!-- ================= الترقية ================= -->
<div id="promoBox">
  <div class="promo-card">
    <h3>اختر وحش الترقية</h3>
    <div class="promo-row">
      <button data-p="q" title="ساحرة">♛</button>
      <button data-p="r" title="غولم">♜</button>
      <button data-p="b" title="تنين">♝</button>
      <button data-p="n" title="وحش مجنّح">♞</button>
    </div>
  </div>
</div>

<!-- ================= شارة النهاية ================= -->
<div id="banner"><div class="inner"></div></div>

<script type="module">
import * as THREE from 'three';

/* =====================================================================
   1) أدوات الرسم الزيتي
   ===================================================================== */
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}
function roundRectPath(g, x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.abs(w)/2, Math.abs(h)/2));
  g.beginPath();
  g.moveTo(x+r, y);
  g.arcTo(x+w, y,   x+w, y+h, r);
  g.arcTo(x+w, y+h, x,   y+h, r);
  g.arcTo(x,   y+h, x,   y,   r);
  g.arcTo(x,   y,   x+w, y,   r);
  g.closePath();
}

/* تأثير "الزيتية": ترشيح بكسلي مع إزاحة عشوائية خفيفة */
function oilify(g, W, H){
  const img = g.getImageData(0, 0, W, H);
  const d = img.data;
  const out = new Uint8ClampedArray(d.length);
  const Q = 22;
  for (let y = 0; y < H; y++){
    for (let x = 0; x < W; x++){
      const ox = Math.round(Math.sin(x*0.63 + y*0.27) * 1.4);
      const oy = Math.round(Math.cos(x*0.41 - y*0.58) * 1.4);
      const sx = Math.min(W-1, Math.max(0, x+ox));
      const sy = Math.min(H-1, Math.max(0, y+oy));
      const i = (sy*W + sx) * 4;
      const o = (y*W + x) * 4;
      out[o]   = Math.round(d[i]   / Q) * Q;
      out[o+1] = Math.round(d[i+1] / Q) * Q;
      out[o+2] = Math.round(d[i+2] / Q) * Q;
      out[o+3] = 255;
    }
  }
  img.data.set(out);
  g.putImageData(img, 0, 0);
}

/* لوحة الألوان الزاهية لكل جانب */
const PAL = {
  w: { a:'#ffd166', b:'#ff9f1c', c:'#06d6a0', eye:'#00f5d4',
       bg1:'#2ec4b6', bg2:'#ffb703', rim:'#ffe066', line:'#7a3d00' },
  b: { a:'#c77dff', b:'#7b2cbf', c:'#4cc9f0', eye:'#ff006e',
       bg1:'#3a0ca3', bg2:'#f72585', rim:'#e0aaff', line:'#2a0050' }
};

/* ---------- خلفية اللوحة الزيتية ---------- */
function paintBackground(g, color){
  const P = PAL[color];
  const sky = g.createLinearGradient(0, 0, 0, 320);
  sky.addColorStop(0,    P.bg1);
  sky.addColorStop(0.55, P.bg2);
  sky.addColorStop(1,    color === 'w' ? '#ffd166' : '#7209b7');
  g.fillStyle = sky;
  g.fillRect(0, 0, 256, 320);

  // توهج مركزي
  const sun = g.createRadialGradient(128, 165, 6, 128, 165, 105);
  sun.addColorStop(0, 'rgba(255,255,255,.55)');
  sun.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sun;
  g.fillRect(0, 0, 256, 320);

  // تلال
  g.fillStyle = hexA(P.b, 0.55);
  g.beginPath();
  g.moveTo(-20, 320);
  g.quadraticCurveTo(60, 218, 140, 292);
  g.quadraticCurveTo(210, 232, 276, 300);
  g.lineTo(276, 330); g.lineTo(-20, 330);
  g.closePath(); g.fill();

  // نجوم / شرارات
  for (let i = 0; i < 46; i++){
    const x = Math.random()*256, y = Math.random()*195;
    g.fillStyle = `rgba(255,255,255,${Math.random()*0.55})`;
    g.beginPath(); g.arc(x, y, Math.random()*2.3, 0, 7); g.fill();
  }
}

/* ---------- رسم الوحوش ---------- */
function paintCreature(g, type, color){
  const P = PAL[color];
  const g0 = g;

  const ell = (x,y,rx,ry,fill,rot=0)=>{
    g0.beginPath(); g0.ellipse(x,y,Math.abs(rx),Math.abs(ry),rot,0,Math.PI*2);
    g0.fillStyle = fill; g0.fill();
  };
  const rrect = (x,y,w,h,r,fill)=>{
    roundRectPath(g0,x,y,w,h,r); g0.fillStyle = fill; g0.fill();
  };
  const tri = (x1,y1,x2,y2,x3,y3,fill)=>{
    g0.beginPath(); g0.moveTo(x1,y1); g0.lineTo(x2,y2); g0.lineTo(x3,y3);
    g0.closePath(); g0.fillStyle = fill; g0.fill();
  };
  const eye = (x,y,r,col)=>{
    ell(x,y,r,r*1.12,col);
    ell(x,y,r*0.44,r*0.52,'#1a0033');
    ell(x - r*0.26, y - r*0.26, r*0.2, r*0.2, '#ffffff');
  };

  g0.save();
  g0.translate(128, 0);

  // هالة خلفية
  const halo = g0.createRadialGradient(0, 182, 10, 0, 182, 132);
  halo.addColorStop(0, hexA(P.a, 0.55));
  halo.addColorStop(1, hexA(P.a, 0));
  g0.fillStyle = halo;
  g0.beginPath(); g0.arc(0, 182, 132, 0, 7); g0.fill();

  if (type === 'p'){
    /* عفريت صغير */
    ell(0, 252, 46, 48, P.b);
    ell(0, 250, 36, 38, P.a);
    ell(-44, 238, 14, 28, P.b, -0.35);
    ell( 44, 238, 14, 28, P.b,  0.35);
    ell(0, 172, 48, 46, P.b);
    ell(0, 170, 39, 37, P.a);
    tri(-28,140, -64,84, -8,132, P.a);
    tri( 28,140,  64,84,  8,132, P.a);
    eye(-16,166,11,P.eye);
    eye( 16,166,11,P.eye);
    g0.fillStyle = P.line;
    roundRectPath(g0,-16,192,32,12,6); g0.fill();
    tri(-12,192,-7,206,-2,192,'#ffffff');
    tri( 12,192, 7,206, 2,192,'#ffffff');
  }
  else if (type === 'r'){
    /* غولم حجري */
    rrect(-88, 206, 32, 96, 16, P.b);
    rrect( 56, 206, 32, 96, 16, P.b);
    rrect(-58, 198, 116, 104, 24, P.b);
    rrect(-46, 210,  92,  80, 20, P.a);
    rrect(-40, 138,  80,  68, 18, P.b);
    rrect(-32, 146,  64,  52, 14, P.a);
    eye(-17,170,11,P.eye);
    eye( 17,170,11,P.eye);
    g0.fillStyle = P.line;
    roundRectPath(g0,-22,192,44,10,5); g0.fill();
    g0.strokeStyle = hexA(P.line, 0.55); g0.lineWidth = 3; g0.lineCap='round';
    g0.beginPath(); g0.moveTo(-10,216); g0.lineTo(4,240); g0.lineTo(-8,262); g0.stroke();
    g0.beginPath(); g0.moveTo( 24,220); g0.lineTo(16,246); g0.stroke();
  }
  else if (type === 'n'){
    /* وحش مجنّح */
    g0.fillStyle = hexA(P.c, 0.92);
    g0.beginPath(); g0.moveTo(-20,200);
    g0.quadraticCurveTo(-124,148,-106,252);
    g0.quadraticCurveTo(-80,226,-30,256); g0.closePath(); g0.fill();
    g0.beginPath(); g0.moveTo(20,200);
    g0.quadraticCurveTo(124,148,106,252);
    g0.quadraticCurveTo(80,226,30,256); g0.closePath(); g0.fill();

    ell(0, 246, 42, 48, P.b);
    ell(0, 244, 32, 38, P.a);
    ell(0, 176, 40, 38, P.b);
    ell(0, 174, 32, 30, P.a);
    tri(-10,196, 0,234, 10,196, P.b);
    eye(-15,170,10,P.eye);
    eye( 15,170,10,P.eye);
    tri(-20,148, -40,106, -6,142, P.a);
    tri( 20,148,  40,106,  6,142, P.a);
  }
  else if (type === 'b'){
    /* تنين بعين واحدة */
    g0.fillStyle = P.b;
    g0.beginPath();
    g0.moveTo(0,116);
    g0.quadraticCurveTo( 68,150,  56,222);
    g0.quadraticCurveTo( 30,272,   0,288);
    g0.quadraticCurveTo(-30,272, -56,222);
    g0.quadraticCurveTo(-68,150,   0,116);
    g0.closePath(); g0.fill();

    g0.fillStyle = P.a;
    g0.beginPath();
    g0.moveTo(0,136);
    g0.quadraticCurveTo( 50,164,  42,216);
    g0.quadraticCurveTo( 24,256,   0,266);
    g0.quadraticCurveTo(-24,256, -42,216);
    g0.quadraticCurveTo(-50,164,   0,136);
    g0.closePath(); g0.fill();

    tri(-34,132, -74,56, -14,120, P.c);
    tri( 34,132,  74,56,  14,120, P.c);

    ell(0, 186, 26, 28, P.eye);
    ell(0, 186, 11, 13, '#1a0033');
    ell(-6, 180,  5,  5, '#ffffff');

    g0.fillStyle = P.line;
    roundRectPath(g0,-26,226,52,12,6); g0.fill();
    for (let i = -2; i <= 2; i++) tri(i*10-3,226, i*10,240, i*10+3,226, '#ffffff');
  }
  else if (type === 'q'){
    /* ساحرة */
    g0.fillStyle = hexA(P.c, 0.95);
    g0.beginPath(); g0.moveTo(-30,150);
    g0.quadraticCurveTo(-98,182,-70,264);
    g0.quadraticCurveTo(-46,220,-26,206); g0.closePath(); g0.fill();
    g0.beginPath(); g0.moveTo(30,150);
    g0.quadraticCurveTo(98,182,70,264);
    g0.quadraticCurveTo(46,220,26,206); g0.closePath(); g0.fill();

    ell(0, 250, 40, 44, P.b);
    ell(0, 248, 30, 34, P.a);
    ell(0, 174, 42, 42, P.b);
    ell(0, 172, 34, 34, P.a);
    eye(-16,168,11,P.eye);
    eye( 16,168,11,P.eye);

    tri(-30,140, -38,96, -12,132, P.rim);
    tri(  0,136,   0,88,  14,132, P.rim);
    tri( 30,140,  38,96,  12,132, P.rim);

    g0.strokeStyle = P.line; g0.lineWidth = 4; g0.lineCap='round';
    g0.beginPath(); g0.arc(0,190,16,0.25,Math.PI-0.25); g0.stroke();
  }
  else if (type === 'k'){
    /* ملك الشياطين */
    g0.fillStyle = P.c;
    g0.beginPath(); g0.moveTo(-34,152);
    g0.quadraticCurveTo(-98,96,-58,40);
    g0.quadraticCurveTo(-72,102,-16,138); g0.closePath(); g0.fill();
    g0.beginPath(); g0.moveTo(34,152);
    g0.quadraticCurveTo(98,96,58,40);
    g0.quadraticCurveTo(72,102,16,138); g0.closePath(); g0.fill();

    ell(0, 256, 52, 50, P.b);
    ell(0, 254, 40, 38, P.a);
    ell(0, 176, 50, 48, P.b);
    ell(0, 174, 41, 39, P.a);

    ell(-19,168,14,15,P.eye);
    ell( 19,168,14,15,P.eye);
    ell(-19,168, 6, 7,'#1a0033');
    ell( 19,168, 6, 7,'#1a0033');

    g0.fillStyle = P.line;
    roundRectPath(g0,-24,198,48,14,7); g0.fill();
    for (let i = -2; i <= 2; i++) tri(i*11-4,198, i*11,212, i*11+4,198, '#ffffff');
  }

  g0.restore();
}

/* ---------- ضربات فرشاة فوقية ---------- */
function paintBrushOverlay(g, color){
  const P = PAL[color];
  const cols = [P.a, P.b, P.c, '#ffffff', P.eye];
  g.lineCap = 'round';
  for (let i = 0; i < 130; i++){
    const x = Math.random()*256, y = Math.random()*320;
    const ang = Math.random()*Math.PI*2;
    const len = 10 + Math.random()*54;
    g.strokeStyle = hexA(cols[(Math.random()*cols.length)|0], 0.04 + Math.random()*0.10);
    g.lineWidth = 2 + Math.random()*8;
    g.beginPath();
    g.moveTo(x, y);
    g.quadraticCurveTo(
      x + Math.cos(ang)*len*0.5 + (Math.random()-0.5)*14,
      y + Math.sin(ang)*len*0.5,
      x + Math.cos(ang)*len,
      y + Math.sin(ang)*len
    );
    g.stroke();
  }
}

/* ---------- إطار اللوحة ---------- */
function paintFrame(g, color){
  const P = PAL[color];

  // إطار خارجي
  g.strokeStyle = P.rim;
  g.lineWidth = 16;
  g.strokeRect(9, 9, 238, 302);

  // خط داخلي
  g.strokeStyle = hexA('#ffffff', 0.45);
  g.lineWidth = 3;
  g.strokeRect(21, 21, 214, 278);

  // زخارف الزوايا
  g.fillStyle = hexA(P.rim, 0.9);
  const c = 26;
  [[0,0],[256,0],[0,320],[256,320]].forEach(([x,y])=>{
    g.beginPath(); g.arc(x, y, c*0.35, 0, 7); g.fill();
  });

  // ظل داخلي
  const sh = g.createLinearGradient(0,0,0,320);
  sh.addColorStop(0, 'rgba(0,0,0,.22)');
  sh.addColorStop(0.12, 'rgba(0,0,0,0)');
  sh.addColorStop(0.88, 'rgba(0,0,0,0)');
  sh.addColorStop(1, 'rgba(0,0,0,.25)');
  g.fillStyle = sh;
  g.fillRect(20, 20, 216, 280);
}

/* ---------- توليد نسيج القطعة ---------- */
const texCache = new Map();
function getPieceTexture(type, color){
  const key = type + color;
  if (texCache.has(key)) return texCache.get(key);

  const W = 256, H = 320;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const g = c.getContext('2d');

  paintBackground(g, color);
  paintCreature(g, type, color);
  paintBrushOverlay(g, color);
  paintFrame(g, color);
  oilify(g, W, H);

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  t.needsUpdate = true;
  texCache.set(key, t);
  return t;
}

/* ---------- نسيج رقعة الشطرنج ---------- */
function makeBoardTexture(){
  const S = 1024;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');

  const L1 = '#ffe9b8', L2 = '#ffcf6b';
  const D1 = '#8a4bd6', D2 = '#5a2ca0';

  for (let r = 0; r < 8; r++){
    for (let f = 0; f < 8; f++){
      const x = f*128, y = (7-r)*128;
      const isLight = (f + r) % 2 === 0;
      const grad = g.createLinearGradient(x, y, x+128, y+128);
      if (isLight){ grad.addColorStop(0, L1); grad.addColorStop(1, L2); }
      else        { grad.addColorStop(0, D1); grad.addColorStop(1, D2); }
      g.fillStyle = grad;
      g.fillRect(x, y, 128, 128);

      // ضربات فرشاة داخل المربع
      for (let i = 0; i < 24; i++){
        const px = x + Math.random()*128, py = y + Math.random()*128;
        const len = 10 + Math.random()*34, ang = Math.random()*Math.PI*2;
        g.strokeStyle = `rgba(255,255,255,${0.03 + Math.random()*0.08})`;
        g.lineWidth = 1 + Math.random()*4;
        g.lineCap = 'round';
        g.beginPath(); g.moveTo(px, py);
        g.lineTo(px + Math.cos(ang)*len, py + Math.sin(ang)*len);
        g.stroke();
      }
    }
  }

  // شبكة ذهبية رقيقة
  g.strokeStyle = 'rgba(255,209,102,.35)';
  g.lineWidth = 2;
  for (let i = 0; i <= 8; i++){
    g.beginPath(); g.moveTo(i*128, 0); g.lineTo(i*128, S); g.stroke();
    g.beginPath(); g.moveTo(0, i*128); g.lineTo(S, i*128); g.stroke();
  }

  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 8;
  return t;
}
