<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Monster Chess 3D - النظام المتكامل</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. المتغيرات الأساسية وإعدادات الصفحة
           ========================================= */
        :root {
            --primary-gold: #ffd700;
            --primary-gold-dark: #b8860b;
            --bg-dark: #05070a;
            --bg-panel: rgba(15, 25, 40, 0.85);
            --border-glow: 0 0 15px rgba(255, 215, 0, 0.4);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --danger-red: #ff4d4d;
            --success-green: #00ff88;
            --font-family: 'Cairo', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: var(--font-family);
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            /* خلفية متدرجة فخمة */
            background-image: radial-gradient(circle at 50% 0%, #1a2a40 0%, #05070a 80%);
        }

        /* =========================================
           2. شاشة تسجيل الدخول
           ========================================= */
        #login-screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            backdrop-filter: blur(10px);
            transition: opacity 0.5s ease;
        }

        .login-box {
            background: var(--bg-panel);
            padding: 40px 30px;
            border-radius: 20px;
            border: 2px solid var(--primary-gold);
            box-shadow: var(--border-glow), inset 0 0 20px rgba(255, 215, 0, 0.1);
            width: 90%;
            max-width: 400px;
            text-align: center;
            position: relative;
        }

        .login-box::before {
            content: '👑';
            font-size: 50px;
            position: absolute;
            top: -30px;
            left: 50%;
            transform: translateX(-50%);
            text-shadow: 0 0 20px var(--primary-gold);
        }

        .login-title {
            font-size: 28px;
            font-weight: 900;
            color: var(--primary-gold);
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(255, 215, 0, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #334;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-gold);
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to bottom, var(--primary-gold), var(--primary-gold-dark));
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
            transition: transform 0.1s;
        }

        .btn-primary:active { transform: scale(0.96); }

        .btn-guest {
            background: transparent;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            box-shadow: none;
            margin-top: 15px;
        }

        /* =========================================
           3. الحاوية الرئيسية للتطبيق
           ========================================= */
        #app-container {
            display: none;
            width: 100%;
            height: 100%;
            position: relative;
            flex-direction: column;
        }

        /* الشريط العلوي الثابت */
        #top-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.6);
            padding: 5px 15px 5px 5px;
            border-radius: 30px;
            border: 1px solid #334;
        }

        .avatar {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #223;
            border: 2px solid var(--primary-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .player-details { text-align: right; }
        .player-name { font-size: 14px; font-weight: bold; }
        .player-level { font-size: 12px; color: var(--primary-gold); }

        .currencies {
            display: flex;
            gap: 10px;
        }

        .currency-box {
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(0,0,0,0.7);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid var(--primary-gold-dark);
            font-weight: bold;
            font-size: 14px;
        }

        .currency-box i { color: var(--primary-gold); font-size: 16px; }
        .currency-box.gems i { color: #00f0ff; }

        /* =========================================
           4. الواجهة الرئيسية (الصورة والأزرار)
           ========================================= */
        #main-menu {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding-bottom: 80px; /* مساحة لشريط التنقل */
            background-image: url('menu.png'); /* ⚠️ ضع صورة الواجهة هنا */
            background-size: cover;
            background-position: center;
        }

        /* تعتيم الصورة قليلاً لبروز الأزرار */
        #main-menu::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(5,7,10,1) 0%, rgba(5,7,10,0.4) 50%, rgba(5,7,10,0) 100%);
            z-index: 1;
        }

        .game-modes-container {
            position: relative;
            z-index: 2;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }

        .mode-card {
            background: rgba(20, 30, 50, 0.7);
            border: 1px solid #334;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            backdrop-filter: blur(5px);
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .mode-card:active { transform: scale(0.95); border-color: var(--primary-gold); }
        .mode-card i { font-size: 30px; margin-bottom: 10px; display: block; }
        .mode-card h3 { font-size: 16px; margin-bottom: 5px; }
        .mode-card p { font-size: 12px; color: var(--text-muted); }

        /* ألوان مخصصة للأزرار */
        .mode-ai { border-color: #2980b9; }
        .mode-ai i { color: #3498db; text-shadow: 0 0 10px #3498db; }
        
        .mode-online { border-color: #27ae60; }
        .mode-online i { color: #2ecc71; text-shadow: 0 0 10px #2ecc71; }
        
        .mode-friends { border-color: #8e44ad; }
        .mode-friends i { color: #9b59b6; text-shadow: 0 0 10px #9b59b6; }
        
        .mode-quick { border-color: #d35400; }
        .mode-quick i { color: #e67e22; text-shadow: 0 0 10px #e67e22; }

        /* =========================================
           5. شريط التنقل السفلي
           ========================================= */
        #bottom-nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 15, 25, 0.95);
            border-top: 1px solid #223;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-muted);
            font-size: 12px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-item i { font-size: 22px; margin-bottom: 4px; }
        .nav-item.active { color: var(--primary-gold); text-shadow: 0 0 10px rgba(255, 215, 0, 0.5); }
        .nav-item.active i { transform: translateY(-3px); }

        /* =========================================
           6. النوافذ المنبثقة (Modals)
           ========================================= */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            z-index: 500;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: linear-gradient(135deg, #0f1928, #05070a);
            border: 2px solid var(--primary-gold-dark);
            border-radius: 20px;
            width: 100%;
            max-width: 450px;
            max-height: 80vh;
            padding: 20px;
            position: relative;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 20px rgba(255, 215, 0, 0.05);
            display: flex;
            flex-direction: column;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            overflow-y: auto;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #223;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .modal-title { font-size: 20px; font-weight: bold; color: var(--primary-gold); }
        
        .close-btn {
            background: var(--danger-red);
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- الملف الشخصي --- */
        .profile-header { text-align: center; margin-bottom: 20px; }
        .profile-avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: #223; border: 3px solid var(--primary-gold);
            margin: 0 auto 10px; display: flex; justify-content: center; align-items: center;
            font-size: 50px; box-shadow: var(--border-glow);
        }
        .profile-name { font-size: 24px; font-weight: bold; }
        .profile-level-text { color: var(--primary-gold); font-weight: bold; margin-bottom: 10px; }
        
        .xp-bar-container {
            background: #111; height: 10px; border-radius: 5px; overflow: hidden;
            margin-bottom: 20px; border: 1px solid #334;
        }
        .xp-bar { background: linear-gradient(to right, #00f0ff, #0055ff); height: 100%; width: 50%; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-box {
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;
            text-align: center; border: 1px solid #223;
        }
        .stat-value { font-size: 20px; font-weight: bold; color: var(--primary-gold); }
        .stat-label { font-size: 12px; color: var(--text-muted); }

        /* --- المتجر --- */
        .shop-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .shop-tab {
            flex: 1; padding: 10px; text-align: center; background: #111;
            border-radius: 10px; cursor: pointer; border: 1px solid #334; font-weight: bold;
        }
        .shop-tab.active { background: var(--primary-gold); color: #000; border-color: var(--primary-gold); }
        
        .shop-item {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;
            margin-bottom: 10px; border: 1px solid #223;
        }
        .shop-item-info { display: flex; align-items: center; gap: 15px; }
        .shop-item-icon { font-size: 30px; }
        .shop-item-title { font-weight: bold; }
        .shop-item-price { font-size: 12px; color: var(--primary-gold); }
        
        .buy-btn {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
            color: white; border: none; padding: 8px 15px; border-radius: 8px;
            font-weight: bold; cursor: pointer;
        }

        /* --- الإنجازات --- */
        .achievement-item {
            display: flex; align-items: center; gap: 15px;
            background: rgba(255,255,255,0.05); padding: 15px; border-radius: 10px;
            margin-bottom: 10px; border: 1px solid #223;
        }
        .ach-icon { font-size: 30px; color: var(--text-muted); }
        .ach-icon.completed { color: var(--success-green); text-shadow: 0 0 10px var(--success-green); }
        .ach-info { flex: 1; }
        .ach-title { font-weight: bold; font-size: 14px; }
        .ach-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 5px; }
        
        /* --- المكافآت اليومية --- */
        .daily-rewards-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .reward-day {
            background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px;
            text-align: center; border: 1px solid #223; position: relative;
        }
        .reward-day.active { border-color: var(--primary-gold); box-shadow: 0 0 10px rgba(255, 215, 0, 0.3); }
        .reward-day i { font-size: 20px; color: var(--primary-gold); margin-bottom: 5px; }
        .reward-day span { display: block; font-size: 12px; }
        .reward-day .claim-btn {
            margin-top: 5px; width: 100%; padding: 5px; font-size: 10px;
            background: var(--primary-gold); border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer;
        }

        /* --- الإعدادات --- */
        .setting-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 0; border-bottom: 1px solid #223;
        }
        .setting-row span { font-weight: bold; }
        
        /* Switch Toggle */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #333; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--success-green); }
        input:checked + .slider:before { transform: translateX(22px); }

        /* الأزرار العامة */
        .btn-danger {
            background: var(--danger-red); color: white; border: none;
            padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer;
            margin-top: 20px;
        }

        /* =========================================
           إشعارات (Toast)
           ========================================= */
        #toast-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 9999; display: flex; flex-direction: column; gap: 10px;
        }
        .toast {
            background: rgba(0,0,0,0.9); border: 1px solid var(--primary-gold);
            color: white; padding: 10px 20px; border-radius: 20px;
            font-size: 14px; font-weight: bold; box-shadow: var(--border-glow);
            animation: slideDown 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; } }

    </style>
</head>
<body>

    <!-- =========================================
         شاشة تسجيل الدخول
         ========================================= -->
    <div id="login-screen">
        <div class="login-box">
            <h1 class="login-title">تسجيل الدخول</h1>
            <div class="input-group">
                <label>اسم البطل:</label>
                <input type="text" id="login-name" placeholder="أدخل اسمك هنا..." maxlength="15">
            </div>
            <div class="input-group">
                <label>كلمة المرور:</label>
                <input type="password" id="login-pass" placeholder="••••••••">
            </div>
            <button class="btn-primary" onclick="loginUser()">دخول إلى اللعبة</button>
            <button class="btn-primary btn-guest" onclick="loginAsGuest()">اللعب كضيف</button>
        </div>
    </div>

    <!-- =========================================
         تطبيق اللعبة
         ========================================= -->
    <div id="app-container">
        
        <!-- الشريط العلوي -->
        <div id="top-header">
            <div class="player-info" onclick="openModal('profile-modal')">
                <div class="avatar" id="ui-avatar">👤</div>
                <div class="player-details">
                    <div class="player-name" id="ui-name">البطل</div>
                    <div class="player-level">المستوى <span id="ui-level">1</span></div>
                </div>
            </div>
            <div class="currencies">
                <div class="currency-box" onclick="openModal('shop-modal')">
                    <i class="fa-solid fa-coins"></i>
                    <span id="ui-coins">1000</span>
                </div>
                <div class="currency-box gems" onclick="openModal('shop-modal')">
                    <i class="fa-solid fa-gem"></i>
                    <span id="ui-gems">50</span>
                </div>
            </div>
        </div>

        <!-- القائمة الرئيسية -->
        <div id="main-menu">
            <div class="game-modes-container">
