
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شطرنج 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:radial-gradient(#08783b,#002515);
 color:white;
 font-family:Tahoma,Arial;
 text-align:center;
}
button{
 padding:14px;
 border:2px solid gold;
 border-radius:15px;
 background:linear-gradient(#ffce00,#c35b00);
 color:white;
 font-weight:bold;
 font-size:17px;
 cursor:pointer;
}
#menu{
 width:100%;
 max-width:690px;
 height:100vh;
 margin:auto;
 background:url("menu.png") center/100% 100% no-repeat;
 position:relative;
}
.menu-buttons{
 position:absolute;
 top:60%;
 width:100%;
 display:flex;
 gap:8px;
 padding:8px;
}
.menu-buttons button{
 flex:1;
 height:130px;
}
#game{
 display:none;
 padding:15px;
 max-width:650px;
 margin:auto;
}
#board{
 display:grid;
 grid-template-columns:repeat(8,1fr);
 width:95%;
 margin:20px auto;
 aspect-ratio:1;
 transform:perspective(800px) rotateX(7deg);
 border:8px solid #7a3908;
 box-shadow:0 18px 0 #321600,0 25px 30px #000;
}
.square{
 display:flex;
 justify-content:center;
 align-items:center;
 aspect-ratio:1;
 cursor:pointer;
 position:relative;
}
.light{background:#e8c58b}
.dark{background:#17623e}
.selected{outline:4px solid yellow;outline-offset:-4px}
.target:after{
 content:"";
 width:25%;
 height:25%;
 border-radius:50%;
 background:#ffe900aa;
}
.piece{
 font-family:"Segoe UI Symbol",serif;
 font-size:clamp(27px,7vw,55px);
 line-height:1;
 filter:drop-shadow(2px 3px 2px #0008);
}
.white{color:white;text-shadow:1px 2px 2px #333}
.black{color:#111;text-shadow:1px 2px 2px white}
.controls{
 display:flex;
 justify-content:center;
 flex-wrap:wrap;
 gap:8px;
}
.panel{
 background:#550025;
 border:3px solid gold;
 border-radius:20px;
 padding:20px;
 margin:20px auto;
 max-width:350px;
}
.hidden{display:none}
</style>
</head>

<body>

<div id="menu">
 <button onclick="settings()">⚙ الإعدادات</button>
 <div class="menu-buttons">
  <button onclick="startGame('friend')">
   تحدي الأصدقاء
  </button>
  <button onclick="startGame('computer')">
   اللعب ضد الكمبيوتر
  </button>
 </div>
</div>

<div id="settings" class="panel hidden">
 <h2>الإعدادات</h2>
 <p>الموسيقى <input id="music" type="checkbox" checked></p>
 <p>صوت النقر <input id="clickSound" type="checkbox" checked></p>
 <button onclick="closeSettings()">حفظ</button>
</div>

<div id="game">
 <h1>♛ شطرنج 3D</h1>
 <h3 id="status">دور الأبيض</h3>

 <div id="board"></div>

 <div class="controls">
  <button onclick="undo()">تراجع</button>
  <button onclick="restart()">إعادة اللعب</button>
  <button onclick="home()">القائمة</button>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/1.4.0/chess.min.js"></script>

<script>
let chess;
let selected=null;
let mode="friend";
let history=[];

const pieces={
 wk:"♔",wq:"♕",wr:"♖",wb:"♗",wn:"♘",wp:"♙",
 bk:"♚",bq:"♛",br:"♜",bb:"♝",bn:"♞",bp:"♟"
};

function settings(){
 document.getElementById("settings").classList.toggle("hidden");
}

function closeSettings(){
 document.getElementById("settings").classList.add("hidden");
}

function sound(){
 if(!document.getElementById("clickSound").checked)return;
 try{
  let a=new AudioContext();
  let o=a.createOscillator();
  let g=a.createGain();
  o.frequency.value=550;
  g.gain.value=.04;
  o.connect(g);
  g.connect(a.destination);
  o.start();
  o.stop(a.currentTime+.06);
 }catch(e){}
}

function startGame(type){
 mode=type;
 chess=new Chess();
 history=[];
 selected=null;
 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";
 render();
 sound();
}

function render(){
 const board=document.getElementById("board");
 board.innerHTML="";

 let moves=selected?
 chess.moves({square:selected,verbose:true}):[];

 for(let r=7;r>=0;r--){
  for(let f=0;f<8;f++){
   let sq="abcdefgh"[f]+(r+1);
   let p=chess.get(sq);
   let cell=document.createElement("div");

   cell.className="square "+((r+f)%2?"dark":"light");

   if(selected===sq)cell.classList.add("selected");

   if(moves.some(m=>m.to===sq))
    cell.classList.add("target");

   if(p){
    let piece=document.createElement("span");
    piece.className="piece "+(p.color==="w"?"white":"black");
    piece.textContent=pieces[p.color+p.type];
    cell.appendChild(piece);
   }

   cell.onclick=()=>play(sq);
   board.appendChild(cell);
  }
 }

 let text=chess.isCheckmate()?"كش مات!":
 chess.isDraw()?"تعادل":
 chess.turn()==="w"?"دور الأبيض":"دور الأسود";

 if(chess.isCheck())text+=" - كش!";
 document.getElementById("status").textContent=text;
}

function play(sq){
 if(chess.isGameOver())return;

 if(selected){
  let move=chess.moves({
   square:selected,
   verbose:true
  }).find(m=>m.to===sq);

  if(move){
   chess.move({
    from:selected,
    to:sq,
    promotion:"q"
   });
   selected=null;
   render();
   sound();

   if(mode==="computer" &&
      !chess.isGameOver() &&
      chess.turn()==="b"){
    setTimeout(computerMove,400);
   }
   return;
  }
 }

 let p=chess.get(sq);

 if(p && p.color===chess.turn()){
  selected=sq;
 }else{
  selected=null;
 }
 render();
 sound();
}

function computerMove(){
 if(chess.isGameOver())return;

 let moves=chess.moves({verbose:true});
 if(!moves.length)return;

 moves.sort((a,b)=>{
  let score=m=>
   (m.captured?3:0)+(m.san.includes("+")?2:0);
  return score(b)-score(a);
 });

 let best=moves.slice(0,Math.min(5,moves.length));
 let m=best[Math.floor(Math.random()*best.length)];

 chess.move({
  from:m.from,
  to:m.to,
  promotion:"q"
 });

 render();
 sound();
}

function undo(){
 if(!chess)return;
 chess.undo();

 if(mode==="computer" && chess.turn()==="b"){
  chess.undo();
 }

 selected=null;
 render();
 sound();
}

function restart(){
 chess.reset();
 selected=null;
 render();
 sound();
}

function home(){
 document.getElementById("game").style.display="none";
 document.getElementById("menu").style.display="block";
}
</script>
</body>
</html>
