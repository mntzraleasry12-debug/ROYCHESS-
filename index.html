<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>لعبة الشطرنج</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0a0a;
            color: white;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================================
           شاشة تسجيل الدخول
           ========================================= */
        #login-screen {
            position: absolute;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a1a2e, #0a0a0a);
            z-index: 100;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            border-radius: 15px;
            text-align: center;
            width: 90%;
            max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .login-box h1 {
            color: #ffd700;
            margin-bottom: 25px;
            font-size: 24px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            background: rgba(0,0,0,0.5);
            color: white;
            font-size: 16px;
            outline: none;
            text-align: center;
        }

        .login-box input:focus {
            border-color: #ffd700;
        }

        /* =========================================
           الواجهة الرئيسية
           ========================================= */
        #main-screen {
            position: absolute;
            inset: 0;
            display: none; /* مخفية بالبداية */
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* ⚠️ هنا اسم صورتك (png.png) */
            background-image: url('png.png');
            background-size: cover;
            background-position: center;
        }

        /* تعتيم خفيف فوق الصورة لبروز الأزرار */
        #main-screen::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            z-index: 1;
        }

        .menu-container {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 80%;
            max-width: 300px;
        }

        .welcome-text {
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 20px;
            text-shadow: 0 2px 5px black;
        }

        /* تنسيق الأزرار الزجاجية */
        .btn {
            background: rgba(20, 20, 20, 0.7);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn:active {
            transform: scale(0.95);
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffd700;
        }

        .btn-play { background: rgba(0, 150, 0, 0.7); border-color: #00ff00; }
        .btn-play:active { background: rgba(0, 200, 0, 0.8); }

        /* =========================================
           شاشة الإعدادات
           ========================================= */
        #settings-screen {
            position: absolute;
            inset: 0;
            display: none; /* مخفية بالبداية */
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 50;
        }

        .settings-box {
            background: #1a1a2e;
            border: 1px solid #333;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 350px;
        }

        .settings-box h2 {
            text-align: center;
            color: #ffd700;
            margin-bottom: 20px;
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #333;
        }

        /* تصميم أزرار التبديل (Switch) */
        .switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .4s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: #ffd700; }
        input:checked + .slider:before { transform: translateX(24px); }

        /* زر الرجوع */
        .btn-back {
            margin-top: 20px;
            background: #e74c3c;
            border: none;
        }
    </style>
</head>
<body>

    <!-- =========================================
         1. شاشة تسجيل الدخول
         ========================================= -->
    <div id="login-screen">
        <div class="login-box">
            <h1>🎮 تسجيل الدخول</h1>
            <input type="text" id="username-input" placeholder="اكتب اسمك هنا..." maxlength="15">
            <button class="btn btn-play" onclick="login()" style="width: 100%;">دخول</button>
        </div>
    </div>

    <!-- =========================================
         2. الواجهة الرئيسية
         ========================================= -->
    <div id="main-screen">
        <div class="menu-container">
            <div class="welcome-text">أهلاً بك، <span id="display-name">لاعب</span> 👑</div>
            
            <button class="btn btn-play" onclick="startGame()">▶️ ابدأ اللعب</button>
            <button class="btn" onclick="openSettings()">⚙️ الإعدادات</button>
            <button class="btn" onclick="logout()" style="background: rgba(150, 0, 0, 0.7); border-color: #ff4444;">🚪 تسجيل خروج</button>
        </div>
    </div>

    <!-- =========================================
         3. شاشة الإعدادات
         ========================================= -->
    <div id="settings-screen">
        <div class="settings-box">
            <h2>⚙️ الإعدادات</h2>
            
            <div class="setting-item">
                <span>الموسيقى</span>
                <label class="switch">
                    <input type="checkbox" id="music-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <span>المؤثرات الصوتية</span>
                <label class="switch">
                    <input type="checkbox" id="sound-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item" style="border: none;">
                <span>الاهتزاز</span>
                <label class="switch">
                    <input type="checkbox" id="vibration-toggle">
                    <span class="slider"></span>
                </label>
            </div>

            <button class="btn btn-back" onclick="closeSettings()" style="width: 100%;">رجوع</button>
        </div>
    </div>

    <!-- =========================================
         الكود البرمجي (Javascript)
         ========================================= -->
    <script>
        // 1. عند فتح الصفحة، نتأكد إذا كان اللاعب مسجل مسبقاً
        window.onload = function() {
            let savedUser = localStorage.getItem('gameUsername');
            if (savedUser) {
                // إذا كان مسجل، ندخل مباشرة ونخفي شاشة الدخول
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-screen').style.display = 'flex';
                document.getElementById('display-name').innerText = savedUser;
            }
        };

        // 2. دالة تسجيل الدخول
        function login() {
            let username = document.getElementById('username-input').value.trim();
            
            if (username === '') {
                alert('الرجاء كتابة اسمك أولاً!');
                return;
            }

            // حفظ الاسم في المتصفح
            localStorage.setItem('gameUsername', username);
            
            // الانتقال للواجهة الرئيسية
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-screen').style.display = 'flex';
            document.getElementById('display-name').innerText = username;
        }

        // 3. دالة تسجيل الخروج
        function logout() {
            if(confirm('هل تريد تسجيل الخروج؟')) {
                localStorage.removeItem('gameUsername');
                location.reload(); // إعادة تحميل الصفحة
            }
        }

        // 4. دالة بدء اللعبة (تنقلك لملف اللعبة)
        function startGame() {
            // ⚠️ هنا تحط اسم ملف اللعبة الخاص بك (مثلاً game.html)
            // window.location.href = 'game.html';
            alert('سيتم فتح اللعبة الآن... (قم بتفعيل هذا السطر في الكود)');
        }

        // 5. دوال فتح وإغلاق الإعدادات
        function openSettings() {
            document.getElementById('settings-screen').style.display = 'flex';
        }

        function closeSettings() {
            document.getElementById('settings-screen').style.display = 'none';
            // هنا يمكنك إضافة كود لحفظ حالة الأزرار إذا أردت
        }
    </script>
</body>
</html>
