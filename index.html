<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐉 Monster Chess 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(ellipse at 50% -10%,#3a0f5c 0%,#1a0428 45%,#07010d 100%);
  color:#fff;font-family:'Cairo',system-ui,Arial,sans-serif;
}

/* ===== الهيدر ===== */
header{
  flex:0 0 auto;padding:6px 10px 8px;text-align:center;
  background:linear-gradient(180deg,rgba(255,215,0,.10),transparent);
  border-bottom:1px solid rgba(255,215,0,.15);
}
h1{
  margin:0;font-size:clamp(15px,4.2vw,24px);font-weight:900;letter-spacing:1px;
  background:linear-gradient(180deg,#fff6cf,#ffc857 45%,#b8860b);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 10px rgba(255,200,87,.45));
}

/* ===== منطقة اللعبة ===== */
#game{
  flex:1 1 auto;min-height:0;width:100%;max-width:820px;
  margin:0 auto;position:relative;touch-action:none;
}
#game canvas{display:block;width:100%;height:100%;touch-action:none}

/* ===== اللوحة السفلية ===== */
.panel{
  flex:0 0 auto;padding:8px 10px 12px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(0deg,rgba(0,0,0,.75),rgba(0,0,0,0));
}
.row{display:flex;gap:8px;justify-content:center;align-items:stretch;flex-wrap:wrap}

#status{
  text-align:center;font-size:clamp(13px,3.6vw,16px);font-weight:700;
  color:#8ee7ff;text-shadow:0 0 12px rgba(142,231,255,.55);min-height:22px;
}
#moves{
  font-size:12px;color:#b9a8d6;text-align:center;line-height:1.6;
  max-height:46px;overflow-y:auto;padding:0 4px;word-break:break-word;
}

/* ===== الأزرار الفاخرة ===== */
.btn-rpg{
  position:relative;border:2px solid #f3d06e;border-radius:14px;
  padding:9px 16px;font-family:inherit;font-weight:900;
  font-size:clamp(12px,3.4vw,15px);color:#fff;cursor:pointer;overflow:hidden;
  text-shadow:0 2px 3px rgba(0,0,0,.7);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.45),
             inset 0 -4px 8px rgba(0,0,0,.5),
             0 4px 12px rgba(0,0,0,.55),
             0 0 14px rgba(243,208,110,.25);
  transition:transform .08s ease, box-shadow .08s ease, filter .15s;
}
.btn-rpg::before{
  content:'';position:absolute;inset:0 0 55% 0;border-radius:12px 12px 60% 60%;
  background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));
  pointer-events:none;
}
.btn-rpg:active{
  transform:translateY(3px);
  box-shadow:inset 0 3px 9px rgba(0,0,0,.8),0 1px 4px rgba(0,0,0,.5);
}
.btn-rpg:disabled{filter:grayscale(.8) brightness(.65);cursor:not-allowed;transform:none}

.btn-gold  {background:linear-gradient(180deg,#ffd966,#d4af37 45%,#9a7410);color:#3a2200;text-shadow:0 1px 1px rgba(255,255,255,.6)}
.btn-blue  {background:linear-gradient(180deg,#5ac8fa,#2f8fd6 45%,#154a78)}
.btn-green {background:linear-gradient(180deg,#5ee08a,#27ae60 45%,#125c33)}
.btn-red   {background:linear-gradient(180deg,#ff6b6b,#d92b2b 45%,#7a0f0f)}
.btn-purple{background:linear-gradient(180deg,#c07ae0,#7a3fb0 45%,#3e1562)}

/* ===== قائمة المستوى ===== */
select#level{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  border:2px solid #f3d06e;border-radius:14px;padding:9px 16px;
  font-family:inherit;font-weight:900;font-size:clamp(12px,3.4vw,15px);
  color:#fff;text-align:center;text-shadow:0 2px 3px rgba(0,0,0,.7);
  background:linear-gradient(180deg,#c07ae0,#7a3fb0 45%,#3e1562);
  box-shadow:inset 0 2px 4px rgba(255,255,255,.35),
             inset 0 -4px 8px rgba(0,0,0,.5),0 4px 12px rgba(0,0,0,.5);
}
select#level option{background:#2a0845;color:#fff}

/* ===== نافذة الترقية ===== */
#promotion{display:none;flex-direction:column;gap:6px;align-items:center}
#promotion.show{display:flex}
#promotion .promo-title{font-size:13px;color:#ffd166;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>🐉 MONSTER CHESS 3D</h1>
</header>

<main id="game"></main>

<section class="panel">
  <div id="status">🎯 دورك — الأبيض</div>

  <div class="row">
    <select id="level">
      <option value="easy">🟢 سهل</option>
      <option value="normal" selected>🟡 متوسط</option>
      <option value="hard">🔴 صعب</option>
    </select>
    <button id="btnNew"  class="btn-rpg btn-gold">🔄 لعبة جديدة</button>
    <button id="btnUndo" class="btn-rpg btn-blue">↩️ تراجع</button>
  </div>

  <div id="promotion">
    <div class="promo-title">اختر ترقية البيدق</div>
    <div class="row">
      <button class="btn-rpg btn-gold" data-promo="q">♛ ملكة</button>
      <button class="btn-rpg btn-gold" data-promo="r">♜ قلعة</button>
      <button class="btn-rpg btn-gold" data-promo="b">♝ فيل</button>
      <button class="btn-rpg btn-gold" data-promo="n">♞ حصان</button>
    </div>
  </div>

  <div id="moves">—</div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
    "chess": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0/dist/esm/chess.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "OrbitControls";
import { Chess } from "chess";

/* ================= عناصر الواجهة ================= */
const holder   = document.getElementById("game");
const statusEl = document.getElementById("status");
const movesEl  = document.getElementById("moves");
const promoEl  = document.getElementById("promotion");
const levelEl  = document.getElementById("level");

/* ================= محرك الشطرنج ================= */
const chess = new Chess();

/* ================= المشهد ثلاثي الأبعاد ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0416);
scene.fog = new THREE.Fog(0x0b0416, 22, 48);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(2.5, 10, 11.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
holder.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.4, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 8;
controls.maxDistance = 18;
controls.minPolarAngle = 0.25;
controls.maxPolarAngle = Math.PI / 2.15;
controls.rotateSpeed = 0.7;

/* ================= الإضاءة ================= */
scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a1140, 1.7));

const sun = new THREE.DirectionalLight(0xffffff, 2.6);
sun.position.set(6, 13, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left   = -8;
sun.shadow.camera.right  =  8;
sun.shadow.camera.top    =  8;
sun.shadow.camera.bottom = -8;
sun.shadow.camera.near   =  1;
sun.shadow.camera.far    =  36;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.02;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x9b5de5, 1.4);
rim.position.set(-9, 7, -9);
scene.add(rim);

/* ================= الأرضية والقاعدة ================= */
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x120820, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.75;
floor.receiveShadow = true;
scene.add(floor);

const base = new THREE.Mesh(
  new THREE.BoxGeometry(8.95, 0.7, 8.95),
  new THREE.MeshStandardMaterial({ color: 0x241a3a, metalness: 0.6, roughness: 0.35 })
);
base.position.y = -0.42;
base.castShadow = true;
base.receiveShadow = true;
scene.add(base);

/* ================= الرقعة ================= */
const files = "abcdefgh";
const LIGHT_COLOR = 0xe9d2a5;
const DARK_COLOR  = 0x8a5a3c;

const boardGroup  = new THREE.Group();
const piecesGroup = new THREE.Group();
scene.add(boardGroup, piecesGroup);

const squareMeshes = new Map();   // square -> mesh
const squareList   = [];          // للـ raycast

function squarePos(sq) {
  const f = files.indexOf(sq[0]);
  const r = parseInt(sq[1], 10);
  return new THREE.Vector3(f - 3.5, 0, 4.5 - r);
}

const squareGeo = new THREE.BoxGeometry(0.98, 0.14, 0.98);

for (let rank = 1; rank <= 8; rank++) {
  for (let f = 0; f < 8; f++) {
    const sq = files[f] + rank;
    const isDark = ((f + rank) % 2) === 1;   // a1 مظلمة
    const color = isDark ? DARK_COLOR : LIGHT_COLOR;

    const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0.05 });
    const mesh = new THREE.Mesh(squareGeo, mat);

    const p = squarePos(sq);
    mesh.position.set(p.x, -0.07, p.z);
    mesh.receiveShadow = true;
    mesh.userData.square = sq;
    mesh.userData.baseColor = color;

    boardGroup.add(mesh);
    squareMeshes.set(sq, mesh);
    squareList.push(mesh);
  }
}

/* ================= هندسة وألوان الوحوش (مشتركة) ================= */
const GEO = {
  sphere: new THREE.SphereGeometry(1, 18, 14),
  cone:   new THREE.ConeGeometry(1, 1, 14),
  cyl:    new THREE.CylinderGeometry(1, 1, 1, 16)
};

const MAT = {
  w:     new THREE.MeshStandardMaterial({ color: 0x24c2a8, roughness: 0.35, metalness: 0.25 }),
  b:     new THREE.MeshStandardMaterial({ color: 0x9b5de5, roughness: 0.35, metalness: 0.25 }),
  gold:  new THREE.MeshStandardMaterial({ color: 0xffc857, roughness: 0.25, metalness: 0.85, emissive: 0x2a1d00 }),
  eye:   new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0x666666 }),
  pupil: new THREE.MeshStandardMaterial({ color: 0x0a0a0a }),
  horn:  new THREE.MeshStandardMaterial({ color: 0x1b1b26, roughness: 0.55 })
};

function makeMonster(type, color) {
  const g = new THREE.Group();
  const body = color === "w" ? MAT.w : MAT.b;

  const add = (geo, mat, x, y, z, sx, sy, sz) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.scale.set(sx, sy, sz);
    m.castShadow = true;
    g.add(m);
    return m;
  };

  // القاعدة
  add(GEO.cyl, MAT.gold, 0, 0.05, 0, 0.33, 0.10, 0.33);
  // الجسم
  add(GEO.sphere, body, 0, 0.44, 0, 0.33, 0.38, 0.30);
  // الرأس
  add(GEO.sphere, body, 0, 0.88, 0.02, 0.31, 0.30, 0.29);
  // الأذرع
  add(GEO.sphere, body, -0.37, 0.46, 0, 0.10, 0.18, 0.11);
  add(GEO.sphere, body,  0.37, 0.46, 0, 0.10, 0.18, 0.11);
  // العيون
  add(GEO.sphere, MAT.eye,   -0.12, 0.93, 0.25, 0.085, 0.10, 0.05);
  add(GEO.sphere, MAT.eye,    0.12, 0.93, 0.25, 0.085, 0.10, 0.05);
  add(GEO.sphere, MAT.pupil, -0.12, 0.94, 0.29, 0.042, 0.052, 0.03);
  add(GEO.sphere, MAT.pupil,  0.12, 0.94, 0.29, 0.042, 0.052, 0.03);
  // القرون
  add(GEO.cone, MAT.horn, -0.19, 1.14, 0, 0.07, 0.22, 0.07);
  add(GEO.cone, MAT.horn,  0.19, 1.14, 0, 0.07, 0.22, 0.07);

  // تمييز كل قطعة
  switch (type) {
    case "k": // الملك
      add(GEO.cyl, MAT.gold, 0, 1.28, 0, 0.27, 0.14, 0.27);
      [-0.17, 0, 0.17].forEach(x => add(GEO.cone, MAT.gold, x, 1.47, 0, 0.07, 0.20, 0.07));
      break;
    case "q": // الملكة
      add(GEO.cyl, MAT.gold, 0, 1.25, 0, 0.23, 0.12, 0.23);
      [-0.13, 0, 0.13].forEach(x => add(GEO.cone, MAT.gold, x, 1.41, 0, 0.055, 0.16, 0.055));
      break;
    case "r": // القلعة
      add(GEO.cyl, MAT.gold, 0, 1.24, 0, 0.29, 0.22, 0.29);
      for (let i = 0; i < 4; i++) {
        const a = i * Math.PI / 2 + Math.PI / 4;
        add(GEO.sphere, MAT.gold, Math.cos(a) * 0.22, 1.37, Math.sin(a) * 0.22, 0.06, 0.08, 0.06);
      }
      break;
    case "b": // الفيل
      add(GEO.cone, MAT.gold, 0, 1.33, 0, 0.16, 0.34, 0.16);
      break;
    case "n": // الحصان
      add(GEO.sphere, MAT.gold, 0, 1.02, 0.28, 0.14, 0.16, 0.22);
      add(GEO.cone, MAT.horn, -0.14, 1.32, -0.02, 0.06, 0.24, 0.06);
      add(GEO.cone, MAT.horn,  0.14, 1.32, -0.02, 0.06, 0.24, 0.06);
      break;
    case "p": // البيدق
      add(GEO.sphere, MAT.gold, 0, 1.24, 0, 0.12, 0.12, 0.12);
      break;
  }

  return g;
}

/* ================= الحالة ================= */
let selected       = null;    // المربع المحدد
let legalMoves     = [];      // الحركات المتاحة للقطعة المحددة
let busy           = false;   // الكمبيوتر يفكر
let pendingPromo   = null;    // {from, to}
let gameOver       = false;
const pieceMap     = new Map();  // square -> group
let pieceMeshes    = [];         // قائمة مسطحة للـ raycast
const tweens       = [];         // حركات أنيميشن

/* ================= رسم القطع ================= */
function rebuildPieces() {
  piecesGroup.clear();
  pieceMap.clear();
  pieceMeshes = [];
  tweens.length = 0;

  const board = chess.board();

  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const p = board[r][f];
      if (!p) continue;

      const sq  = files[f] + (8 - r);
      const grp = makeMonster(p.type, p.color);
      const pos = squarePos(sq);

      grp.position.set(pos.x, 0, pos.z);
      grp.rotation.y = (p.color === "w") ? Math.PI : 0;  // يتقابلان
      grp.userData.square = sq;
      grp.userData.color  = p.color;

      grp.traverse(o => {
        if (o.isMesh) {
          o.userData.pieceRoot = grp;
          pieceMeshes.push(o);
        }
      });

      piecesGroup.add(grp);
      pieceMap.set(sq, grp);
    }
  }
}

/* ================= التمييز البصري ================= */
function paint(sq, hex) {
  const m = squareMeshes.get(sq);
  if (m) m.material.color.setHex(hex);
}

function findKing(color) {
  const b = chess.board();
  for (let r = 0; r < 8; r++)
    for (let f = 0; f < 8; f++) {
      const p = b[r][f];
      if (p && p.type === "k" && p.color === color) return files[f] + (8 - r);
    }
  return null;
}

function refreshHighlights() {
  for (const [sq, mesh] of squareMeshes) {
    mesh.material.color.setHex(mesh.userData.baseColor);
  }

  // الملك في خطر
  if (chess.isCheck()) {
    const ks = findKing(chess.turn());
    if (ks) paint(ks, 0xe23c3c);
  }

  // القطعة المحددة + الحركات
  if (selected) {
    paint(selected, 0xffd166);
    for (const m of legalMoves) {
      paint(m.to, m.captured ? 0xff8a5c : 0x3ce08a);
    }
  }
}

/* ================= اختيار القطعة ================= */
function selectSquare(sq) {
  selected = sq;
  legalMoves = chess.moves({ square: sq, verbose: true });
  refreshHighlights();
}

function deselect() {
  selected = null;
  legalMoves = [];
  refreshHighlights();
}

/* ================= سجل الحركات ================= */
function updateHistory() {
  const h = chess.history();
  if (!h.length) { movesEl.textContent = "—"; return; }

  const parts = [];
  for (let i = 0; i < h.length; i += 2) {
    parts.push(`${(i / 2) + 1}. ${h[i]}${h[i + 1] ? " " + h[i + 1] : ""}`);
  }
  movesEl.textContent = parts.join("   ");
  movesEl.scrollTop = movesEl.scrollHeight;
}

/* ================= الحالة النصية ================= */
function updateStatus() {
  refreshHighlights();

  if (chess.isCheckmate()) {
    gameOver = true;
    const winner = chess.turn() === "w" ? "الأسود" : "الأبيض";
    statusEl.textContent = `🏆 كش مات! فاز ${winner}`;
    return true;
  }
  if (chess.isStalemate()) {
    gameOver = true;
    statusEl.textContent = "🤝 تعادل — الجمود (لا توجد حركات)";
    return true;
  }
  if (chess.isDraw()) {
    gameOver = true;
    statusEl.textContent = "🤝 انتهت المباراة بالتعادل";
    return true;
  }

  gameOver = false;

  if (chess.isCheck()) {
    statusEl.textContent = `⚠️ كش! ${chess.turn() === "w" ? "الأبيض" : "الأسود"} في خطر`;
  } else {
    statusEl.textContent = chess.turn() === "w" ? "🎯 دورك — الأبيض" : "🤖 الكمبيوتر يفكر...";
  }
  return false;
}

/* ================= أنيميشن الحركة ================= */
function animatePiece(sq, fromPos) {
  const obj = pieceMap.get(sq);
  if (!obj) return;

  const to = squarePos(sq);
  obj.position.set(fromPos.x, 0, fromPos.z);
  tweens.push({
    obj,
    fx: fromPos.x, fz: fromPos.z,
    tx: to.x,      tz: to.z,
    t: 0, dur: 0.26
  });
}

/* ================= تنفيذ حركة اللاعب ================= */
function doPlayerMove(from, to, promotion) {
  const opts = { from, to };
  if (promotion) opts.promotion = promotion;

  let mv = null;
  try { mv = chess.move(opts); } catch (e) { mv = null; }
  if (!mv) { deselect(); return; }

  selected     = null;
  legalMoves   = [];
  pendingPromo = null;
  promoEl.classList.remove("show");

  const fromPos = squarePos(from);

  rebuildPieces();
  animatePiece(to, fromPos);
  updateHistory();

  const over = updateStatus();

  if (!over && chess.turn() === "b") {
    busy = true;
    setTimeout(computerTurn, 240);
  }
}

/* ================= الترقية ================= */
function askPromotion(from, to) {
  pendingPromo = { from, to };
  promoEl.classList.add("show");
}

promoEl.querySelectorAll("[data-promo]").forEach(btn => {
  btn.addEventListener("click", () => {
    if (!pendingPromo) return;
    const { from, to } = pendingPromo;
    pendingPromo = null;
    promoEl.classList.remove("show");
    doPlayerMove(from, to, btn.dataset.promo);
  });
});

/* ================= محرك الكمبيوتر ================= */
const MATE = 1e6;
const PIECE_VALUE = { p: 100, n: 320, b: 335, r: 500, q: 950, k: 0 };

let searchNodes    = 0;
let searchDeadline = 0;
let timeUp         = false;

function evaluateWhite() {
  const board = chess.board();
  let score = 0;

  for (let r = 0; r < 8; r++) {
    for (let f = 0; f < 8; f++) {
      const p = board[r][f];
      if (!p) continue;

      let v = PIECE_VALUE[p.type];

      if (p.type !== "k") {
        v += (7 - (Math.abs(3.5 - f) + Math.abs(3.5 - r))) * 2;
      }
      if (p.type === "p") {
        v += (p.color === "w" ? (6 - r) : (r - 1)) * 6;
      }

      score += (p.color === "w") ? v : -v;
    }
  }
  return score;
}

function negamax(depth, alpha, beta, ply) {
  searchNodes++;
  if ((searchNodes & 255) === 0 && performance.now() > searchDeadline) {
    timeUp = true;
  }
  if (timeUp) return 0;

  if (depth <= 0) {
    return (chess.turn() === "w" ? 1 : -1) * evaluateWhite();
  }

  const moves = chess.moves({ verbose: true });

  if (moves.length === 0) {
    return chess.isCheck() ? -MATE + ply : 0;
  }

  // الأكل أولاً لتسريع البحث
  moves.sort((a, b) =>
    (b.captured ? PIECE_VALUE[b.captured] : 0) -
    (a.captured ? PIECE_VALUE[a.captured] : 0)
  );

  let best = -Infinity;

  for (const m of moves) {
    const opts = { from: m.from, to: m.to };
    if (m.promotion) opts.promotion = m.promotion;

    chess.move(opts);
    const score = -negamax(depth - 1, -beta, -alpha, ply + 1);
    chess.undo();

    if (timeUp) return best === -Infinity ? 0 : best;

    if (score > best) best = score;
