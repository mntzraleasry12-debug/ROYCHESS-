<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Monster Chess 3D</title>
    
    <!-- استدعاء مكتبات الثري دي والشطرنج -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
            "chess": "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js"
        }
    }
    </script>

    <style>
        /* --- إعدادات الصفحة الأساسية --- */
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; background-color: #000; color: white;
            font-family: Arial, sans-serif; text-align: center;
            overflow: hidden; display: flex; justify-content: center; align-items: center;
            height: 100vh;
        }

        /* --- 1. الواجهة الرئيسية (الصورة والأزرار) --- */
        #menu-wrapper {
            position: relative; display: flex; justify-content: center; align-items: center;
            height: 100vh; width: 100vw; background-color: #000; z-index: 10;
        }
        #menu-image {
            height: 100vh; width: auto; max-width: 100vw; object-fit: contain;
        }
        .hotspot {
            position: absolute; cursor: pointer; border: none; outline: none;
            background-color: rgba(255, 0, 0, 0); transition: background-color 0.2s;
        }
        #btn-settings { top: 2%; left: 2%; width: 15%; height: 10%; }
        #btn-friends { bottom: 10%; left: 5%; width: 42%; height: 18%; }
        #btn-computer { bottom: 10%; right: 5%; width: 42%; height: 18%; }

        /* زر التعديل (لرؤية أماكن الأزرار) */
        #debug-btn {
            position: absolute; top: 10px; right: 10px; z-index: 9999;
            background: #00ff00; color: black; border: none; padding: 5px 10px;
            cursor: pointer; font-weight: bold; border-radius: 5px; font-size: 12px; opacity: 0.5;
        }

        /* --- 2. شاشة الإعدادات --- */
        #settings-modal {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #222; border: 2px solid #ffd700; border-radius: 15px; padding: 20px;
            z-index: 3000; color: white; text-align: center; width: 250px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        #settings-modal h2 { margin-top: 0; color: #ffd700; }
        .setting-row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px; }
        .close-btn { margin-top: 15px; padding: 10px; background: #d500f9; color: white; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }

        /* --- 3. شاشة اللعبة 3D --- */
        #game-container {
            display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0;
            background: #101323; flex-direction: column; z-index: 20;
        }
        header { padding: 10px; background: #202943; }
        h1 { margin: 0; color: #ffd166; font-size: 20px; }
        header div { font-size: 12px; margin-top: 5px; }
        
        .panel { padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .controls-row { display: flex; justify-content: center; gap: 10px; width: 100%; }
        
        button, select {
            padding: 10px 15px; border: 0; border-radius: 10px; background: #ffc857;
            color: #222; font-weight: bold; font-size: 14px; cursor: pointer; flex: 1; max-width: 150px;
        }
        button:active { transform: scale(0.96); }
        
        #game { width: 100%; flex: 1; min-height: 50vh; display: block; }
        #status { color: #8ee7ff; font-size: 16px; margin: 5px; font-weight: bold; }
        .info { color: #ddd; font-size: 12px; margin-bottom: 10px; }
        
        /* زر العودة للواجهة */
        .back-btn {
            position: absolute; top: 15px; right: 15px; padding: 8px 15px; background: #f44336;
            color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; z-index: 100;
        }
        
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; color: #fff; }
    </style>
</head>
<body>

    <!-- 1. الواجهة الرئيسية -->
    <div id="menu-wrapper">
        <button id="debug-btn" onclick="toggleDebug()">تعديل الأزرار</button>
        <img id="menu-image" src="menu.png" alt="القائمة">
        <button class="hotspot" id="btn-settings" onclick="openSettings()"></button>
        <button class="hotspot" id="btn-friends" onclick="startGame()"></button>
        <button class="hotspot" id="btn-computer" onclick="startGame()"></button>
    </div>

    <!-- 2. نافذة الإعدادات -->
    <div id="settings-modal">
        <h2>الإعدادات</h2>
        <div class="setting-row">
            <span>الموسيقى</span>
            <input type="checkbox" id="music-toggle" checked onchange="toggleMusic()">
        </div>
        <div class="setting-row">
            <span>صوت النقر</span>
            <input type="checkbox" id="sfx-toggle" checked>
        </div>
        <button class="close-btn" onclick="closeSettings()">إغلاق</button>
    </div>

    <!-- 3. شاشة اللعبة 3D -->
    <div id="game-container">
        <button class="back-btn" onclick="goBack()">عودة</button>
        <header>
            <h1>🐉 MONSTER CHESS</h1>
            <div>شطرنج الوحوش ثلاثي الأبعاد</div>
        </header>

        <div class="panel">
            <div class="controls-row">
                <select id="level">
                    <option value="easy">🟢 السهل</option>
                    <option value="hard">🔴 الصعب</option>
                </select>
                <button onclick="restart()">🔄 لعبة جديدة</button>
                <button onclick="undo()">↩ تراجع</button>
            </div>
        </div>

        <div id="loading">جاري تحميل اللعبة...</div>
        <div id="game"></div>

        <div class="panel">
            <div id="status">دورك الآن - الأبيض</div>
            <div class="info">اسحب الشاشة للتدوير، والمس الوحش ثم المربع للتحريك.</div>
        </div>
    </div>

    <!-- موسيقى الخلفية -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=chess-think-110112.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ==========================================
        // --- أكواد القائمة والإعدادات والصوت ---
        // ==========================================
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2;
        let audioCtx;

        function playClick() {
            if (!document.getElementById('sfx-toggle').checked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        document.body.addEventListener('click', function initAudio() {
            if(document.getElementById('music-toggle').checked) bgMusic.play().catch(e => {});
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.body.removeEventListener('click', initAudio);
        }, { once: true });

        function toggleMusic() {
            if(document.getElementById('music-toggle').checked) bgMusic.play();
            else bgMusic.pause();
        }

        function openSettings() { playClick(); document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettings() { playClick(); document.getElementById('settings-modal').style.display = 'none'; }

        let isDebug = false;
        function toggleDebug() {
            isDebug = !isDebug;
            const hotspots = document.querySelectorAll('.hotspot');
            const colors = ['rgba(255, 0, 0, 0.5)', 'rgba(0, 255, 0, 0.5)', 'rgba(0, 0, 255, 0.5)'];
            hotspots.forEach((btn, index) => {
                btn.style.backgroundColor = isDebug ? colors[index] : 'rgba(255, 0, 0, 0)';
            });
        }

        let gameInitialized = false;
        function startGame() {
            playClick();
            document.getElementById('menu-wrapper').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            
            // تشغيل محرك 3D إذا لم يكن يعمل
            if (!gameInitialized) {
                init3DGame();
                gameInitialized = true;
            } else {
                // تحديث حجم الشاشة عند العودة
                window.dispatchEvent(new Event('resize'));
            }
        }

        function goBack() {
            playClick();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-wrapper').style.display = 'flex';
        }
    </script>

    <!-- ========================================== -->
    <!-- --- محرك لعبة الوحوش 3D --- -->
    <!-- ========================================== -->
    <script type="module">
        import * as THREE from "three";
        import {OrbitControls} from "OrbitControls";
        import {Chess} from "chess";

        let game, holder, scene, camera, renderer, controls;
        let selected = null, busy = false, squares = [], pieceMeshes = [];
        const files = "abcdefgh";
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();

        window.init3DGame = function() {
            document.getElementById("loading").style.display = "none";
            game = new Chess();
            holder = document.getElementById("game");
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x101323);

            camera = new THREE.PerspectiveCamera(45, holder.clientWidth / holder.clientHeight, 0.1, 100);
            camera.position.set(7, 9, 11);

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(holder.clientWidth, holder.clientHeight);
            renderer.shadowMap.enabled = true;
            holder.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2.05;
            controls.minDistance = 8;
            controls.maxDistance = 19;

            scene.add(new THREE.HemisphereLight(0xffffff, 0x333344, 2));
            const light = new THREE.DirectionalLight(0xffffff, 3);
            light.position.set(5, 10, 7);
            light.castShadow = true;
            scene.add(light);

            const board = new THREE.Group(); scene.add(board);
            const pieces = new THREE.Group(); scene.add(pieces);

            // بناء المربعات
            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const mesh = new THREE.Mesh(
                        new THREE.BoxGeometry(1, 0.25, 1),
                        new THREE.MeshStandardMaterial({ color: (r + f) % 2 ? 0x9b684c : 0xe5c99a })
                    );
                    mesh.position.set(f - 3.5, -0.13, 3.5 - r);
                    mesh.userData.square = true;
                    board.add(mesh); squares.push(mesh);
                }
            }

            const base = new THREE.Mesh(
                new THREE.BoxGeometry(8.5, 0.4, 8.5),
                new THREE.MeshStandardMaterial({ color: 0x292d42 })
            );
            base.position.y = -0.4; board.add(base);

            // ربط دوال اللعبة بالنافذة (Window) لتجنب مشاكل النطاق
            window.game = game;
            window.piecesGroup = pieces;
            window.renderer = renderer;
            window.camera = camera;
            window.scene = scene;
            window.controls = controls;
            
            drawPieces();
            animate();
            
            renderer.domElement.addEventListener("click", click);
            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            if(!renderer || !holder) return;
            camera.aspect = holder.clientWidth / holder.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(holder.clientWidth, holder.clientHeight);
        }

        function monster(type, color) {
            const group = new THREE.Group();
            const bodyColor = color === "w" ? 0x37c9b0 : 0x8e55d8;
            const material = new THREE.MeshStandardMaterial({ color: bodyColor, roughness: 0.35, metalness: 0.15 });
            const dark = new THREE.MeshStandardMaterial({ color: 0x202030 });
            const eye = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const black = new THREE.MeshStandardMaterial({ color: 0x111111 });

            function sphere(x, y, z, sx, sy, sz, mat) {
                const m = new THREE.Mesh(new THREE.SphereGeometry(1, 20, 16), mat);
                m.position.set(x, y, z); m.scale.set(sx, sy, sz); m.castShadow = true;
                group.add(m); return m;
            }
            function horn(x, z) {
                const h = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.4, 12), new THREE.MeshStandardMaterial({ color: 0xffd166 }));
                h.position.set(x, 1.25, z); group.add(h);
            }

            sphere(0, 0.48, 0, 0.35, 0.48, 0.3, material);
            sphere(0, 0.9, 0, 0.34, 0.34, 0.32, material);
            for (const x of [-0.14, 0.14]) {
                sphere(x, 1, 0.27, 0.10, 0.12, 0.07, eye);
                sphere(x, 1, 0.33, 0.045, 0.065, 0.035, black);
            }

            if (type === "k") { horn(-0.2, 0); horn(0.2, 0); sphere(0, 1.4, 0, 0.28, 0.12, 0.25, new THREE.MeshStandardMaterial({ color: 0xffc857 })); }
            if (type === "q") { for (let i = -1; i <= 1; i++) horn(i * 0.2, 0); }
            if (type === "r") { const crown = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.2, 0.6), dark); crown.position.y = 1.25; group.add(crown); }
            if (type === "b") { horn(0, 0); sphere(0, 1.3, 0, 0.13, 0.18, 0.13, dark); }
            if (type === "n") { sphere(0, 0.9, 0.35, 0.15, 0.22, 0.35, dark); horn(0.15, 0.1); }
            if (type === "p") { sphere(0, 1.25, 0, 0.13, 0.15, 0.13, new THREE.MeshStandardMaterial({ color: 0xffd166 })); }

            group.userData.type = type;
            return group;
        }

        function squarePos(s) {
            return { x: files.indexOf(s[0]) - 3.5, z: 3.5 - (Number(s[1]) - 1) };
        }

        function drawPieces() {
            piecesGroup.clear();
            pieceMeshes = [];
            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let f = 0; f < 8; f++) {
                    const p = boardState[r][f];
                    if (!p) continue;
                    const s = files[f] + (8 - r);
                    const pos = squarePos(s);
                    const obj = monster(p.type, p.color);
                    obj.position.set(pos.x, 0.05, pos.z);
                    obj.userData.position = s;
                    obj.userData.color = p.color;
                    obj.userData.type = p.type;
                    piecesGroup.add(obj);
                    pieceMeshes.push(obj);
                }
            }
        }

        function clearHighlights() {
            squares.forEach(s => {
                s.material.color.setHex(
                    (Math.round(s.position.x + 3.5) + Math.round(3.5 - s.position.z)) % 2 ? 0x9b684c : 0xe5c99a
                );
            });
        }

        function highlightMoves(from) {
            clearHighlights();
            const moves = game.moves({ square: from, verbose: true });
            moves.forEach(m => {
                const pos = squarePos(m.to);
                const sqr = squares.find(s => Math.abs(s.position.x - pos.x) < 0.01 && Math.abs(s.position.z - pos.z) < 0.01);
                if (sqr) sqr.material.color.setHex(0x54d68b);
            });
        }

        function status(text) {
            document.getElementById("status").textContent = text;
        }

        function finishCheck() {
            if (game.isCheckmate()) { status("🏆 كش مات! الفائز: " + (game.turn() === "w" ? "الأسود" : "الأبيض")); return true; }
            if (game.isDraw()) { status("🤝 تعادل!"); return true; }
            if (game.isCheck()) { status("⚠️ كش! انتبه لملكك"); return false; }
            status(game.turn() === "w" ? "دورك الآن - الأبيض" : "🤖 الكمبيوتر يفكر...");
            return false;
        }

        function playerMove(from, to) {
            const move = game.move({ from, to, promotion: "q" });
            if (!move) return false;
            drawPieces();
            clearHighlights();
            selected = null;
            return true;
        }

        function evaluate() {
            const values = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
            let score = 0;
            game.board().forEach(row => row.forEach(p => {
                if (p) score += (p.color === "b" ? 1 : -1) * values[p.type];
            }));
            return score;
        }

        function minimax(depth, alpha, beta, maximizing) {
            if (depth === 0 || game.isGameOver()) return evaluate();
            const moves = game.moves();
            if (maximizing) {
                let best = -Infinity;
                for (const m of moves) {
                    game.move(m); best = Math.max(best, minimax(depth - 1, alpha, beta, false)); game.undo();
                    alpha = Math.max(alpha, best); if (beta <= alpha) break;
                }
                return best;
            } else {
                let best = Infinity;
                for (const m of moves) {
                    game.move(m); best = Math.min(best, minimax(depth - 1, alpha, beta, true)); game.undo();
                    beta = Math.min(beta, best); if (beta <= alpha) break;
                }
                return best;
            }
        }

        window.computerMove = function() {
            if (game.isGameOver()) return;
            const moves = game.moves();
            if (!moves.length) return;
            const hard = document.getElementById("level").value === "hard";
            let chosen;

            if (!hard) {
                const captures = moves.filter(m => m.includes("x"));
                const pool = Math.random() < 0.45 && captures.length ? captures : moves;
                chosen = pool[Math.floor(Math.random() * pool.length)];
            } else {
                let best = -Infinity;
                for (const m of moves) {
                    game.move(m); const score = minimax(2, -Infinity, Infinity, false); game.undo();
                    if (score > best) { best = score; chosen = m; }
                }
            }
            game.move(chosen);
            drawPieces();
            finishCheck();
        }

        // --- دالة النقر المكتملة ---
        function click(event) {
            if (busy || game.isGameOver() || game.turn() !== "w") return;

            const rect = r
