<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>شطرنج الوحوش 3D - القائمة</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #000; overflow: hidden; width: 100vw; height: 100vh; }

    #ui-container {
        position: relative; width: 100%; height: 100%;
        /* ✅ اسم صورة الواجهة (غيرها إذا كان اسمها مختلف) */
        background-image: url('menu.png'); 
        background-size: 100% 100%; background-position: center; background-repeat: no-repeat;
    }

    .hotspot { position: absolute; background: transparent; border: none; cursor: pointer; border-radius: 12px; z-index: 10; transition: background 0.1s; }
    .hotspot:active { background: rgba(255, 255, 255, 0.15); }

    /* إحداثيات الأزرار */
    .btn-settings { top: 1.5%; left: 2%; width: 8%; height: 4%; border-radius: 50%; } 
    .btn-cart { top: 1.5%; left: 12%; width: 9%; height: 4%; } 
    .btn-gold-plus { top: 1.5%; left: 37%; width: 6%; height: 3%; border-radius: 50%; } 
    .btn-gem-plus { top: 1.5%; left: 71%; width: 6%; height: 3%; border-radius: 50%; } 
    .btn-profile { top: 1.5%; right: 2%; width: 13%; height: 6%; border-radius: 50%; } 
    .btn-tournament { top: 8.5%; left: 2.5%; width: 20%; height: 6.5%; } 
    .btn-ranking { top: 9.5%; right: 2.5%; width: 18%; height: 4.5%; } 
    .btn-champions { top: 15.5%; right: 2.5%; width: 18%; height: 5%; } 
    .btn-friends { top: 48.5%; left: 3%; width: 45%; height: 12%; } 
    
    /* 🟢 زر فتح اللعبة (مربوط بملف game.html) */
    .btn-vs-computer { top: 48.5%; right: 3%; width: 45%; height: 12%; } 
    
    .btn-online { top: 61.5%; left: 3%; width: 45%; height: 12%; } 
    .btn-quick { top: 61.5%; right: 3%; width: 45%; height: 12%; } 
    .nav-store { bottom: 0; left: 0; width: 20%; height: 10%; } 
    .nav-inventory { bottom: 0; left: 20%; width: 20%; height: 10%; } 
    .nav-home { bottom: 0; left: 40%; width: 20%; height: 10%; } 
    .nav-stats { bottom: 0; left: 60%; width: 20%; height: 10%; } 
    .nav-achievements { bottom: 0; left: 80%; width: 20%; height: 10%; } 
</style>
</head>
<body>

    <div id="ui-container">
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-cart" onclick="alert('المتجر')"></div>
        <div class="hotspot btn-profile" onclick="alert('الملف')"></div>
        <div class="hotspot btn-friends" onclick="alert('الأصدقاء')"></div>
        
        <!-- ✅ هنا زر "العب ضد الكمبيوتر" اللي ينقل لملف game.html -->
        <div class="hotspot btn-vs-computer" onclick="window.location.href='game.html'"></div>
        
        <div class="hotspot btn-quick" onclick="window.location.href='game.html'"></div>
        
        <div class="hotspot nav-home" onclick="alert('الرئيسية')"></div>
    </div>

</body>
</html>
