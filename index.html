<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>شطرنج الوحوش</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #000; color: white; overflow: hidden; width: 100vw; height: 100vh; }

    /* =========================================
       الحاوية الرئيسية (خلفية صورتك)
       ========================================= */
    #ui-container {
        position: absolute; inset: 0;
        /* ✅ تم تعديل الاسم هنا ليطابق صورتك في GitHub */
        background-image: url('board.png.jpg'); 
        background-size: 100% 100%; /* تمدد الصورة لتملأ الشاشة */
        background-position: center;
        background-repeat: no-repeat;
        z-index: 10;
    }

    /* =========================================
       شبكة الشطرنج الشفافة فوق المربعات
       ========================================= */
    #board {
        position: absolute;
        /* تم ضبط هذه الأرقام بدقة لتناسب صورة الرقعة */
        top: 27.2%; 
        left: 2%;
        width: 96%; 
        aspect-ratio: 1 / 1; 
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
    }

    .square {
        display: flex; justify-content: center; align-items: center;
        cursor: pointer; position: relative;
    }

    /* تأثيرات اختيار القطع */
    .selected { background-color: rgba(255, 215, 0, 0.5) !important; box-shadow: inset 0 0 15px #ffd700; }
    .valid-move::after {
        content: ''; position: absolute; width: 30%; height: 30%;
        background-color: rgba(0, 255, 0, 0.6); border-radius: 50%; box-shadow: 0 0 10px #0f0;
    }
    .valid-capture::after {
        content: ''; position: absolute; width: 85%; height: 85%;
        border: 4px solid rgba(255, 0, 0, 0.8); border-radius: 50%; box-shadow: 0 0 15px #f00;
    }

    /* تصميم البيادق */
    .piece {
        font-size: 9vw; 
        max-font-size: 55px;
        z-index: 5;
        line-height: 1;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .piece-w { color: #ffffff; text-shadow: 0 0 8px #000, 0 0 15px #ffd700; }
    .piece-b { color: #111111; text-shadow: 0 0 8px #fff, 0 0 15px #555; }

    /* =========================================
       الأزرار الشفافة المضبوطة فوق صورتك
       ========================================= */
    .hotspot { position: absolute; background: transparent; cursor: pointer; z-index: 20; border-radius: 50%; }
    .hotspot:active { background: rgba(255, 255, 255, 0.2); }

    /* الشريط العلوي */
    .btn-settings { top: 1.5%; left: 1%; width: 12%; height: 6%; border-radius: 10px; }
    .btn-profile { top: 1.5%; right: 4%; width: 14%; height: 7%; border-radius: 50%; }

    /* الأزرار السفلية */
    .btn-hint { bottom: 2%; left: 4%; width: 20%; height: 11%; }
    .btn-undo { bottom: 2%; left: 27%; width: 20%; height: 11%; }
    .btn-pieces { bottom: 2%; left: 50%; width: 20%; height: 11%; }
    .btn-restart { bottom: 2%; left: 73%; width: 22%; height: 11%; }

    /* شاشة الفوز */
    #win-screen { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    #win-screen h1 { color: #ffd700; font-size: 40px; margin-bottom: 20px; text-shadow: 0 0 20px #d4af37; }
    .btn-win { background: #8b0000; color: white; border: 2px solid #ffd700; padding: 15px 40px; font-size: 20px; border-radius: 10px; cursor: pointer; margin-top: 20px;}
</style>
</head>
<body>

    <!-- الحاوية الرئيسية -->
    <div id="ui-container">
        <!-- شبكة اللعب (القطع) -->
        <div id="board"></div>

        <!-- الأزرار الشفافة -->
        <div class="hotspot btn-settings" onclick="alert('الإعدادات قريباً')"></div>
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        
        <div class="hotspot btn-hint" onclick="showHint()"></div>
        <div class="hotspot btn-undo" onclick="undoMove()"></div>
        <div class="hotspot btn-pieces" onclick="alert('تغيير القطع قريباً')"></div>
        <div class="hotspot btn-restart" onclick="restartGame()"></div>
    </div>

    <!-- شاشة الفوز -->
    <div id="win-screen">
        <h1 id="win-title">🏆 فوز!</h1>
        <button class="btn-win" onclick="restartGame()">العب مرة أخرى</button>
    </div>

    <!-- مكتبة قوانين الشطرنج -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>

    <script>
        const game = new Chess();
        let selectedSquare = null;
        let isThinking = false;
        let hintSquare = null;

        const symbols = {
            'wp': '♙', 'wn': '♘', 'wb': '♗', 'wr': '♖', 'wq': '♕', 'wk': '♔',
            'bp': '♟', 'bn': '♞', 'bb': '♝', 'br': '♜', 'bq': '♛', 'bk': '♚'
        };

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode(97 + c); 
                    const rank = 8 - r;
                    const squareName = file + rank;

                    const squareDiv = document.createElement('div');
                    squareDiv.className = 'square';
                    squareDiv.dataset.square = squareName;

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        const pieceKey = piece.color + piece.type;
                        pieceSpan.textContent = symbols[pieceKey];
                        pieceSpan.className = 'piece ' + (piece.color === 'w' ? 'piece-w' : 'piece-b');
                        squareDiv.appendChild(pieceSpan);
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateHighlights();
        }

        function handleSquareClick(square) {
            if (isThinking || game.game_over() || game.turn() !== 'w') return;
            
            hintSquare = null;

            const piece = game.get(square);

            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                }
                return;
            }

            const moves = game.moves({ square: selectedSquare, verbose: true });
            const move = moves.find(m => m.to === square);

            if (move) {
                game.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                renderBoard();
                
                if (checkGameOver()) return;

                isThinking = true;
                setTimeout(makeComputerMove, 300); 
            } else {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        }

        function updateHighlights() {
            document.querySelectorAll('.square').forEach(sq => sq.classList.remove('selected', 'valid-move', 'valid-capture'));
            
            if (!selectedSquare) return;

            const selectedDiv = document.querySelector(`[data-square="${selectedSquare}"]`);
            if (selectedDiv) selectedDiv.classList.add('selected');

            const moves = game.moves({ square: selectedSquare, verbose: true });
            moves.forEach(m => {
                const targetDiv = document.querySelector(`[data-square="${m.to}"]`);
                if (targetDiv) {
                    if (m.flags.includes('c') || m.flags.includes('e')) {
                        targetDiv.classList.add('valid-capture');
                    } else {
                        targetDiv.classList.add('valid-move');
                    }
                }
            });
        }

        function makeComputerMove() {
            const moves = game.moves();
            if (moves.length === 0) return;

            let bestMove = null;
            let bestValue = -9999;
            const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

            moves.forEach(move => {
                game.move(move);
                let boardValue = 0;
                game.board().forEach(row => {
                    row.forEach(piece => {
                        if (piece) {
                            let val = pieceValues[piece.type];
                            boardValue += piece.color === 'b' ? val : -val;
                        }
                    });
                });
                game.undo();

                boardValue += Math.random() * 30;

                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            });

            game.move(bestMove);
            isThinking = false;
            selectedSquare = null;
            renderBoard();
            checkGameOver();
        }

        function checkGameOver() {
            const winScreen = document.getElementById('win-screen');
            const winTitle = document.getElementById('win-title');

            if (game.in_checkmate()) {
                winTitle.textContent = game.turn() === 'w' ? '💀 خسارة' : '🏆 فوز ساحق!';
                winTitle.style.color = game.turn() === 'w' ? '#ff4d4d' : '#ffd700';
                winScreen.style.display = 'flex';
                return true;
            } else if (game.in_draw()) {
                winTitle.textContent = '🤝 تعادل';
                winScreen.style.display = 'flex';
                return true;
            }
            return false;
        }

        function restartGame() {
            game.reset();
            selectedSquare = null;
            isThinking = false;
            hintSquare = null;
            document.getElementById('win-screen').style.display = 'none';
            renderBoard();
        }

        function undoMove() {
            if (isThinking || game.history().length < 2) return;
            game.undo(); 
            game.undo(); 
            selectedSquare = null;
            hintSquare = null;
            renderBoard();
        }

        function showHint() {
            if (isThinking || game.turn() !== 'w') return;
            const moves = game.moves({ verbose: true });
            if (moves.length > 0) {
                const randomMove = moves[Math.floor(Math.random() * moves.length)];
                hintSquare = randomMove.from;
                
                document.querySelectorAll('.square').forEach(sq => {
                    sq.style.boxShadow = "none";
                    sq.style.backgroundColor = "transparent";
                });
                const hDiv = document.querySelector(`[data-square="${hintSquare}"]`);
                if (hDiv) {
                    hDiv.style.boxShadow = "inset 0 0 20px 5px #00ffff";
                    hDiv.style.backgroundColor = "rgba(0, 255, 255, 0.4)";
                }
            }
        }

        restartGame();
    </script>
</body>
</html>
