<script type="module">
import * as THREE from "three";
import {Chess} from "chess";

const chess=new Chess();
const holder=document.getElementById("game");
const files="abcdefgh";

let selected=null;
let thinking=false;
let pendingPromotion=null;
let gameStarted=false;
let initialized=false;
let audioContext=null;

function sound(freq=650){
 if(!document.getElementById("sound").checked)return;
 try{
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioContext)audioContext=new AC();
  if(audioContext.state==="suspended")audioContext.resume();
  const osc=audioContext.createOscillator();
  const gain=audioContext.createGain();
  osc.connect(gain);gain.connect(audioContext.destination);
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.055,audioContext.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+.13);
  osc.start();osc.stop(audioContext.currentTime+.13);
 }catch(e){}
}

window.comingSoon=function(name){
 sound();document.getElementById("notice").textContent="✨ "+name+" - قريباً في تحديث جديد!";
};
window.openSettings=function(){
 sound();document.getElementById("settings").style.display="flex";
};
window.closeSettings=function(){
 sound();document.getElementById("settings").style.display="none";
};

// المشهد الثلاثي الأبعاد
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151126);

const camera=new THREE.PerspectiveCamera(42,1,.1,100);
camera.position.set(7.8,10.5,12.5);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
holder.appendChild(renderer.domElement);

// لا توجد OrbitControls: الكاميرا ثابتة تماماً
scene.add(new THREE.HemisphereLight(0xffffff,0x303040,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(5,12,7);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const fillLight=new THREE.PointLight(0x8c4dff,35,18);
fillLight.position.set(-5,5,-5);
scene.add(fillLight);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x101020,roughness:1})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.85;
floor.receiveShadow=true;
scene.add(floor);

// القاعدة الذهبية السفلية
const goldBase=new THREE.Mesh(
 new THREE.BoxGeometry(9,.16,9),
 new THREE.MeshStandardMaterial({
  color:0xc28b32,metalness:.8,roughness:.25
 })
);
goldBase.position.y=-.72;
goldBase.receiveShadow=true;
scene.add(goldBase);

// جسم القاعدة
const base=new THREE.Mesh(
 new THREE.BoxGeometry(8.85,.65,8.85),
 new THREE.MeshStandardMaterial({
  color:0x29213e,metalness:.55,roughness:.3
 })
);
base.position.y=-.34;
base.castShadow=true;
base.receiveShadow=true;
scene.add(base);

// إطار زخرفي
const frame=new THREE.Mesh(
 new THREE.BoxGeometry(8.95,.08,8.95),
 new THREE.MeshStandardMaterial({
  color:0xffd36b,metalness:.85,roughness:.2
 })
);
frame.position.y=-.69;
scene.add(frame);

const board=new THREE.Group();
scene.add(board);

const pieces=new THREE.Group();
scene.add(pieces);

const squares=[];
const squareMaterials=new Map();

function position(square){
 return {
  x:files.indexOf(square[0])-3.5,
  z:Number(square[1])-4.5
 };
}

// إنشاء اللوحة
function makeBoard(){
 for(let rank=8;rank>=1;rank--){
  for(let f=0;f<8;f++){
   const s=files[f]+rank;
   const p=position(s);
   const light=(rank+f)%2===0;

   const mat=new THREE.MeshStandardMaterial({
    color:light?0xe9d2a5:0x70452f,
    roughness:.65,
    metalness:.05
   });

   const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(.99,.15,.99),
    mat
   );

   mesh.position.set(p.x,-.035,p.z);
   mesh.receiveShadow=true;
   mesh.userData.square=s;
   board.add(mesh);
   squares.push(mesh);
   squareMaterials.set(s,light?0xe9d2a5:0x70452f);
  }
 }
}

// تصميم الوحوش
function monster(type,color){

 const g=new THREE.Group();
 const whiteSide=color==="w";

 const skin=new THREE.MeshStandardMaterial({
  color:whiteSide?0x24cdbb:0x8438c9,
  roughness:.3,metalness:.12
 });

 const dark=new THREE.MeshStandardMaterial({
  color:whiteSide?0x087a79:0x40145f,
  roughness:.4
 });

 const gold=new THREE.MeshStandardMaterial({
  color:0xffc83d,metalness:.7,roughness:.22,
  emissive:0x493000
 });

 const eyeWhite=new THREE.MeshStandardMaterial({color:0xffffff});
 const black=new THREE.MeshStandardMaterial({color:0x100c19});
 const glow=new THREE.MeshStandardMaterial({
  color:0x65eaff,emissive:0x16bfff,emissiveIntensity:2
 });

 function sphere(x,y,z,sx,sy,sz,mat){
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,20,16),mat);
  m.position.set(x,y,z);
  m.scale.set(sx,sy,sz);
  m.castShadow=true;
  m.receiveShadow=true;
  g.add(m);
  return m;
 }

 function cone(x,y,z,r,h,mat){
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,12),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  g.add(m);
  return m;
 }

 function cylinder(x,y,z,rt,rb,h,mat,n=20){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,n),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  g.add(m);
  return m;
 }

 function box(x,y,z,sx,sy,sz,mat){
  const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);
  m.position.set(x,y,z);
  m.castShadow=true;
  g.add(m);
  return m;
 }

 // القاعدة الشخصية
 cylinder(0,.08,0,.34,.38,.13,gold);
 cylinder(0,.17,0,.29,.29,.09,dark);
 cylinder(0,.24,0,.24,.24,.08,skin);

 // الجسم
 sphere(0,.57,0,.28,.37,.25,skin);

 // الذراعان
 for(const side of [-1,1]){
  sphere(side*.31,.55,0,.105,.23,.12,skin);
  sphere(side*.32,.34,.04,.12,.12,.12,dark);
 }

 // الرأس
 sphere(0,1.02,0,.31,.30,.28,skin);

 // الأذنان والقرون
 cone(-.24,1.38,0,.12,.38,gold);
 cone(.24,1.38,0,.12,.38,gold);

 // العيون
 for(const x of [-.13,.13]){
  sphere(x,1.06,.235,.095,.11,.065,eyeWhite);
  sphere(x,1.06,.291,.043,.06,.035,black);
  sphere(x-.015,1.09,.321,.018,.02,.012,eyeWhite);
 }

 // الفم والأنياب
 box(0,.88,.255,.19,.045,.045,dark);
 cone(-.07,.85,.29,.035,.12,eyeWhite);
 cone(.07,.85,.29,.035,.12,eyeWhite);

 if(type==="k"){
  // الملك
  cylinder(0,1.34,0,.25,.3,.13,gold);
  for(let i=0;i<5;i++){
   const a=i*Math.PI*2/5;
   const x=Math.cos(a)*.23;
   const z=Math.sin(a)*.23;
   cone(x,1.55,z,.09,.32,gold);
   sphere(x,1.70,z,.055,.055,.055,glow);
  }
  sphere(0,1.52,.02,.10,.12,.10,glow);
  sphere(0,1.76,0,.10,.10,.10,gold);
 }

 if(type==="q"){
  // الملكة
  cylinder(0,1.34,0,.23,.28,.12,gold);
  for(let i=0;i<7;i++){
   const a=i*Math.PI*2/7;
   cone(Math.cos(a)*.24,1.52,Math.sin(a)*.24,.07,.27,gold);
  }
  sphere(0,1.53,0,.22,.08,.22,gold);
  sphere(0,1.63,0,.09,.12,.09,glow);
  for(const side of [-1,1]){
   sphere(side*.37,.75,0,.17,.30,.09,gold);
   cone(side*.40,1.0,0,.12,.35,skin);
  }
 }

 if(type==="r"){
  // القلعة المدرعة
  cylinder(0,1.30,0,.32,.35,.25,dark);
  cylinder(0,1.46,0,.34,.34,.12,gold);
  for(let i=0;i<8;i++){
   const a=i*Math.PI/4;
   box(Math.cos(a)*.27,1.58,Math.sin(a)*.27,.13,.24,.13,gold);
  }
  sphere(0,.58,.24,.24,.24,.10,dark);
  box(0,.58,.34,.28,.16,.08,gold);
 }

 if(type==="b"){
  // الفيل الساحر
  cone(0,1.47,0,.29,.48,dark);
  sphere(0,1.43,.05,.13,.13,.13,glow);
  const crystal=new THREE.Mesh(new THREE.OctahedronGeometry(.17),glow);
  crystal.position.set(0,1.80,0);
  crystal.castShadow=true;
  g.add(crystal);
  cone(0,.66,0,.40,.55,dark);
  cylinder(.43,.83,.08,.035,.035,.85,gold,12);
  sphere(.43,1.28,.08,.12,.12,.12,glow);
 }

 if(type==="n"){
  // حصان التنين
  sphere(0,1.02,.12,.27,.34,.36,skin);
  sphere(0,.91,.39,.25,.15,.22,dark);
  sphere(0,.89,.55,.18,.10,.14,skin);
  for(const x of [-.09,.09]){
   sphere(x,.91,.66,.035,.025,.025,black);
  }
  cone(-.18,1.40,-.03,.11,.42,gold);
  cone(.18,1.40,-.03,.11,.42,gold);
  for(let i=0;i<4;i++){
   cone(0,1.35-i*.13,-.18,.10,.22,gold);
  }
  for(const side of [-1,1]){
   sphere(side*.35,.78,-.05,.19,.27,.07,dark);
  }
 }

 if(type==="p"){
  // البيدق الصغير
  sphere(0,.55,.02,.25,.30,.24,skin);
  sphere(0,1.04,0,.27,.26,.25,skin);
  for(const x of [-.12,.12]){
   sphere(x,1.07,.21,.105,.12,.06,eyeWhite);
   sphere(x,1.07,.265,.05,.07,.03,black);
  }
  cone(-.17,1.35,0,.08,.23,gold);
  cone(.17,1.35,0,.08,.23,gold);
  sphere(0,.56,.23,.15,.17,.035,gold);
 }

 return g;
}

// رسم القطع
function draw(){
 pieces.clear();
 const state=chess.board();

 for(let r=0;r<8;r++){
  for(let f=0;f<8;f++){
   const p=state[r][f];
   if(!p)continue;

   const s=files[f]+(8-r);
   const pos=position(s);
   const obj=monster(p.type,p.color);

   obj.position.set(pos.x,.05,pos.z);
   obj.userData.square=s;
   obj.userData.color=p.color;
   pieces.add(obj);
  }
 }
}

function resetColors(){
 squares.forEach(s=>{
  s.material.color.setHex(squareMaterials.get(s.userData.square));
 });
}

function showMoves(from){
 resetColors();
 const moves=chess.moves({square:from,verbose:true});
 moves.forEach(m=>{
  const sq=squares.find(x=>x.userData.square===m.to);
  if(sq)sq.material.color.setHex(0x39dc83);
 });
}

function updateStatus(){
 const status=document.getElementById("status");

 if(chess.isCheckmate()){
  status.textContent="🏆 كش مات! "+(chess.turn()==="w"?"الأسود":"الأبيض")+" فاز!";
  return true;
 }
 if(chess.isStalemate()){
  status.textContent="🤝 تعادل بسبب الجمود!";
  return true;
 }
 if(chess.isDraw()){
  status.textContent="🤝 المباراة انتهت بالتعادل";
  return true;
 }
 if(chess.isCheck()){
  status.textContent="⚠️ كش! الملك مهدد";
  return false;
 }
 status.textContent=chess.turn()==="w"?"دورك الآن - الأبيض":"🤖 الكمبيوتر يفكر...";
 return false;
}

function updateMoves(){
 document.getElementById("moves").textContent=
  chess.history().join("  ")||"سجل الحركات سيظهر هنا";
}

function makeMove(from,to,promotion="q"){
 try{
  const move=chess.move({from,to,promotion});
  if(!move)return false;
  draw();
  resetColors();
  selected=null;
  updateMoves();
  sound(move.captured?850:650);
  return true;
 }catch(e){return false}
}

// تقييم القطع
function evaluate(){
 if(chess.isCheckmate())return chess.turn()==="w"?100000:-100000;
 if(chess.isDraw())return 0;

 const values={p:100,n:320,b:330,r:500,q:900,k:20000};
 let score=0;

 chess.board().forEach((row,r)=>{
  row.forEach((p,f)=>{
   if(!p)return;
   let value=values[p.type];

   if(p.type==="p")value+=(p.color==="b"?r:7-r)*4;

   const center=7-(Math.abs(3.5-f)+Math.abs(3.5-r));
   value+=center*2;
   score+=p.color==="b"?value:-value;
  });
 });
 return score;
}

function minimax(depth,alpha,beta,maximizing){
 if(depth===0||chess.isGameOver())return evaluate();
 const moves=chess.moves();

 if(maximizing){
  let best=-Infinity;
  for(const m of moves){
   chess.move(m);
   best=Math.max(best,minimax(depth-1,alpha,beta,false));
   chess.undo();
   alpha=Math.max(alpha,best);
   if(beta<=alpha)break;
  }
  return best;
 }else{
  let best=Infinity;
  for(const m of moves){
   chess.move(m);
   best=Math.min(best,minimax(depth-1,alpha,beta,true));
   chess.undo();
   beta=Math.min(beta,best);
   if(beta<=alpha)break;
  }
  return best;
 }
}

// الكمبيوتر
function computer(){
 if(chess.isGameOver())return;

 const moves=chess.moves();
 if(!moves.length)return;

 let chosen;

 if(document.getElementById("level").value==="easy"){
  const captures=moves.filter(m=>m.includes("x"));
  const pool=Math.random()<.5&&captures.length?captures:moves;
  chosen=pool[Math.floor(Math.random()*pool.length)];
 }else{
  let best=-Infinity;
  for(const m of moves){
   chess.move(m);
