<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج الوحوش 3D - واجهة الأزرار</title>
    <!-- استدعاء خط عربي فاخر -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <style>
        /* إعدادات الخلفية العامة (خلفية اللعبة) */
        body {
            margin: 0;
            padding: 20px;
            background: radial-gradient(circle at center, #2a0845 0%, #1a002b 100%);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: white;
            gap: 20px;
        }

        /* الحاوية الرئيسية للأزرار */
        .ui-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            max-width: 900px;
            background: rgba(0, 0, 0, 0.3);
            padding: 30px;
            border-radius: 20px;
            border: 2px solid rgba(255, 215, 0, 0.2);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(138, 43, 226, 0.3);
        }

        /* القاعدة الأساسية لكل الأزرار */
        .btn-rpg {
            position: relative;
            border: none;
            cursor: pointer;
            font-family: 'Cairo', sans-serif;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.1s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            /* تأثير الحواف المعدنية */
            border: 2px solid #f3d06e;
            box-shadow: 
                inset 0 2px 5px rgba(255, 255, 255, 0.6), /* لمعة علوية */
                inset 0 -4px 8px rgba(0, 0, 0, 0.6),     /* ظل سفلي داخلي */
                0 5px 15px rgba(0, 0, 0, 0.6),           /* ظل خارجي */
                0 0 15px rgba(243, 208, 110, 0.4);       /* توهج سحري */
        }

        /* تأثير اللمعة الزجاجية (Glossy) */
        .btn-rpg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 45%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0) 100%);
            border-radius: 10px 10px 50% 50%;
            pointer-events: none;
        }

        /* تأثير الضغط (3D Push) */
        .btn-rpg:active {
            transform: translateY(4px);
            box-shadow: 
                inset 0 2px 5px rgba(0, 0, 0, 0.8),
                0 2px 5px rgba(0, 0, 0, 0.6),
                0 0 10px rgba(243, 208, 110, 0.8);
        }

        /* ---- الأحجام ---- */
        .btn-large {
            width: 320px;
            height: 80px;
            font-size: 26px;
            border-radius: 40px; /* حواف دائرية للزر الرئيسي */
        }

        .btn-medium {
            width: 200px;
            height: 60px;
            font-size: 18px;
        }

        .btn-small {
            width: 130px;
            height: 50px;
            font-size: 15px;
            border-radius: 8px;
        }

        /* ---- الألوان والتدرجات ---- */
        
        /* ذهبي ملكي (ابدأ المواجهة - التحديات) */
        .btn-gold {
            background: linear-gradient(to bottom, #ffd700 0%, #d4af37 40%, #aa7c11 100%);
            color: #4a2500;
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        /* بنفسجي سحري (أونلاين - المتجر) */
        .btn-purple {
            background: linear-gradient(to bottom, #b06ab3 0%, #6b2d9e 40%, #3e1562 100%);
            border-color: #d4af37;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.6), 0 5px 15px rgba(0, 0, 0, 0.6), 0 0 15px rgba(176, 106, 179, 0.6);
        }

        /* أخضر (ضد الكمبيوتر) */
        .btn-green {
            background: linear-gradient(to bottom, #2ecc71 0%, #27ae60 40%, #145a32 100%);
            border-color: #d4af37;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.6), 0 5px 15px rgba(0, 0, 0, 0.6), 0 0 15px rgba(46, 204, 113, 0.5);
        }

        /* أزرق (العودة) */
        .btn-blue {
            background: linear-gradient(to bottom, #3498db 0%, #2980b9 40%, #154360 100%);
            border-color: #d4af37;
        }

        /* أحمر (إلغاء - خروج) */
        .btn-red {
            background: linear-gradient(to bottom, #ff4b4b 0%, #cc0000 40%, #800000 100%);
            border-color: #d4af37;
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.4), inset 0 -4px 8px rgba(0, 0, 0, 0.6), 0 5px 15px rgba(0, 0, 0, 0.6), 0 0 15px rgba(255, 75, 75, 0.5);
        }

        /* برتقالي/نحاسي (التحديات الكبرى) */
        .btn-orange {
            background: linear-gradient(to bottom, #f39c12 0%, #d35400 40%, #873600 100%);
            border-color: #f3d06e;
        }

        /* تنسيق العناوين الداخلية */
        .section-title {
            width: 100%;
            text-align: center;
            color: #f3d06e;
            text-shadow: 0 0 10px #f3d06e;
            margin: 10px 0;
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="ui-container">
        
        <div class="section-title">الأزرار الرئيسية</div>
        <!-- 1. ابدأ المواجهة -->
        <button class="btn-rpg btn-large btn-gold">⚔️ ابدأ المواجهة</button>

        <div class="section-title">أوضاع اللعب</div>
        <!-- 2. اللعب أونلاين -->
        <button class="btn-rpg btn-medium btn-purple">🌐 اللعب أونلاين</button>
        <!-- 3. اللعب ضد الكمبيوتر -->
        <button class="btn-rpg btn-medium btn-green">🤖 ضد الكمبيوتر</button>
        <!-- 4. التحديات الكبرى -->
        <button class="btn-rpg btn-medium btn-orange">🏆 التحديات الكبرى</button>

        <div class="section-title">القوائم الجانبية (أزرار صغيرة)</div>
        <!-- 5. الإعدادات -->
        <button class="btn-rpg btn-small btn-gold">⚙️ الإعدادات</button>
        <!-- 6. الإنجازات -->
        <button class="btn-rpg btn-small btn-gold">🏅 الإنجازات</button>
        <!-- 7. المهام اليومية -->
        <button class="btn-rpg btn-small btn-gold">📜 المهام اليومية</button>
        <!-- 8. المتجر -->
        <button class="btn-rpg btn-small btn-purple">🛒 المتجر</button>
        <!-- 9. المخزون -->
        <button class="btn-rpg btn-small btn-gold">🎒 المخزون</button>
        <!-- 10. حسابي -->
        <button class="btn-rpg btn-small btn-blue">👤 حسابي</button>

        <div class="section-title">أزرار التحكم (تأكيد / إلغاء / عودة)</div>
        <!-- 11. العودة -->
        <button class="btn-rpg btn-medium btn-blue">⬅️ العودة</button>
        <!-- 12. تأكيد -->
        <button class="btn-rpg btn-medium btn-green">✅ تأكيد</button>
        <!-- 13. إلغاء -->
        <button class="btn-rpg btn-medium btn-red">❌ إلغاء</button>
        <!-- 14. خروج -->
        <button class="btn-rpg btn-medium btn-red">🚪 خروج</button>

    </div>

</body>
</html>
