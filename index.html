<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>شطرنج الوحوش 2D - نار هادئة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0a0a0a; color: white; overflow: hidden; width: 100vw; height: 100vh; }

    /* =========================================
       1. الواجهة الرئيسية (القائمة)
       ========================================= */
    #main-menu {
        position: absolute; inset: 0; z-index: 100;
        background-color: #1a1a1a; /* لون خلفية احتياطي إذا الصورة ما اشتغلت */
        /* ⚠️ هنا اسم صورتك بالضبط */
        background-image: url('menu.png'); 
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        display: block;
    }
    
    .hotspot { position: absolute; background: transparent; border: none; cursor: pointer; border-radius: 15px; z-index: 10; transition: background 0.1s; }
    .hotspot:active { background: rgba(255, 255, 255, 0.2); }

    /* إحداثيات الأزرار */
    .btn-settings { top: 1.5%; left: 2%; width: 8%; height: 4%; border-radius: 50%; } 
    .btn-cart { top: 1.5%; left: 12%; width: 9%; height: 4%; } 
    .btn-gold-plus { top: 1.5%; left: 37%; width: 6%; height: 3%; border-radius: 50%; } 
    .btn-gem-plus { top: 1.5%; left: 71%; width: 6%; height: 3%; border-radius: 50%; } 
    .btn-profile { top: 1.5%; right: 2%; width: 13%; height: 6%; border-radius: 50%; } 
    .btn-tournament { top: 8.5%; left: 2.5%; width: 20%; height: 6.5%; } 
    .btn-ranking { top: 9.5%; right: 2.5%; width: 18%; height: 4.5%; } 
    .btn-champions { top: 15.5%; right: 2.5%; width: 18%; height: 5%; } 
    .btn-friends { top: 48.5%; left: 3%; width: 45%; height: 12%; } 
    
    /* 🟢 زر فتح اللعبة */
    .btn-vs-computer { top: 48.5%; right: 3%; width: 45%; height: 12%; } 
    
    .btn-online { top: 61.5%; left: 3%; width: 45%; height: 12%; } 
    .btn-quick { top: 61.5%; right: 3%; width: 45%; height: 12%; } 
    .nav-store { bottom: 0; left: 0; width: 20%; height: 10%; } 
    .nav-inventory { bottom: 0; left: 20%; width: 20%; height: 10%; } 
    .nav-home { bottom: 0; left: 40%; width: 20%; height: 10%; } 
    .nav-stats { bottom: 0; left: 60%; width: 20%; height: 10%; } 
    .nav-achievements { bottom: 0; left: 80%; width: 20%; height: 10%; } 

    /* =========================================
       2. شاشة اللعبة (نار هادئة)
       ========================================= */
    #game-container {
        position: absolute; inset: 0; display: none; background: #0f0c08; z-index: 50;
        flex-direction: column; justify-content: center; align-items: center;
        padding: 10px;
        background: radial-gradient(circle at center, #2a1a10 0%, #0f0c08 100%);
    }

    #top-bar { display: flex; justify-content: space-between; width: 100%; max-width: 450px; margin-bottom: 15px; }
    #status { background: rgba(0,0,0,0.6); border: 1px solid #d4af37; color: #ffd700; padding: 8px 20px; border-radius: 20px; font-weight: bold; font-size: 16px; box-shadow: 0 0 10px rgba(212, 175, 55, 0.3); }
    .btn-back { background: #5c1a1a; color: white; border: 1px solid #ff4d4d; padding: 8px 15px; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(255, 77, 77, 0.3); }
    .btn-back:active { transform: scale(0.95); }

    /* تصميم الرقعة */
    #board-container {
        position: relative;
        width: 100%;
        max-width: 450px;
        aspect-ratio: 1 / 1;
        border: 4px solid #3a2515;
        box-shadow: 0 0 25px rgba(255, 69, 0, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
        border-radius: 8px;
        background: #1a120b;
    }

    #board {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        grid-template-rows: repeat(8, 1fr);
        width: 100%;
        height: 100%;
        border-radius: 4px;
        overflow: hidden;
    }

    .square {
        display: flex; justify-content: center; align-items: center;
        font-size: 8vw; /* حجم القطع */
        max-font-size: 45px;
        cursor: pointer;
        position: relative;
    }

    .light { background-color: #e6c27a; } /* ذهبي دافئ */
    .dark { background-color: #2b1d14; }  /* بني فحمي */

    /* التوهج للمربع المحدد والمربعات المتاحة */
    .selected { box-shadow: inset 0 0 15px 5px rgba(255, 69, 0, 0.8) !important; background-color: rgba(255, 100, 0, 0.4) !important; }
    
    .valid-move::after {
        content: ''; position: absolute; width: 30%; height: 30%;
        background-color: rgba(255, 69, 0, 0.6); border-radius: 50%; box-shadow: 0 0 10px #ff4500;
    }

    .valid-capture::after {
        content: ''; position: absolute; width: 80%; height: 80%;
        border: 4px solid rgba(255, 0, 0, 0.7); border-radius: 50%; box-shadow: 0 0 15px #ff0000;
    }

    /* تنسيق القطع */
    .piece-white { color: #ffffff; text-shadow: 0 0 5px #aaa, 0 0 10px #ffaa00; }
    .piece-black { color: #000000; text-shadow: 0 0 5px #555, 0 0 10px #ff4500; }

    /* شاشة الفوز */
    #win-screen {
        display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 200;
        flex-direction: column; justify-content: center; align-items: center;
    }
    #win-screen h1 { color: #ffd700; font-size: 40px; text-shadow: 0 0 20px #ff4500; margin-bottom: 20px; }
</style>
</head>
<body>

    <!-- =========================================
         الواجهة الرئيسية
         ========================================= -->
    <div id="main-menu">
        <div class="hotspot btn-settings" onclick="alert('الإعدادات')"></div>
        <div class="hotspot btn-cart" onclick="alert('سلة المشتريات')"></div>
        <div class="hotspot btn-gold-plus" onclick="alert('شراء ذهب')"></div>
        <div class="hotspot btn-gem-plus" onclick="alert('شراء جواهر')"></div>
        <div class="hotspot btn-profile" onclick="alert('الملف الشخصي')"></div>
        <div class="hotspot btn-tournament" onclick="alert('بطولة الشطرنج')"></div>
        <div class="hotspot btn-ranking" onclick="alert('الترتيب')"></div>
        <div class="hotspot btn-champions" onclick="alert('لوحة الأبطال')"></div>
        <div class="hotspot btn-friends" onclick="alert('تحدي الأصدقاء')"></div>
        
        <!-- 🟢 زر اللعب -->
        <div class="hotspot btn-vs-computer" onclick="startGame()"></div>
        <div class="hotspot btn-quick" onclick="startGame()"></div>
        
        <div class="hotspot btn-online" onclick="alert('الأونلاين قريباً')"></div>
        <div class="hotspot nav-store" onclick="alert('المتجر')"></div>
        <div class="hotspot nav-inventory" onclick="alert('المخزون')"></div>
        <div class="hotspot nav-home" onclick="alert('أنت في الرئيسية')"></div>
        <div class="hotspot nav-stats" onclick="alert('الإحصائيات')"></div>
        <div class="hotspot nav-achievements" onclick="alert('الإنجازات')"></div>
    </div>

    <!-- =========================================
         شاشة اللعبة (2D)
         ========================================= -->
    <div id="game-container">
        <div id="top-bar">
            <div id="status">دورك (الأبيض)</div>
            <button class="btn-back" onclick="exitGame()">خروج 🚪</button>
        </div>

        <!-- الرقعة -->
        <div id="board-container">
            <div id="board"></div>
        </div>

        <!-- شاشة الفوز -->
        <div id="win-screen">
            <h1 id="win-title">🏆 فوز!</h1>
            <button class="btn-back" style="font-size: 20px; padding: 15px 40px; margin-top: 20px;" onclick="exitGame()">العودة للقائمة</button>
        </div>
    </div>

    <!-- مكتبة قوانين الشطرنج (رابط مضمون 100%) -->
    <script src="https://cdn.jsdelivr.net/npm/chess.js@0.10.3/chess.min.js"></script>

    <script>
        // إذا المكتبة ما اشتغلت، نطلع تنبيه
        if (typeof Chess === 'undefined') {
            alert('خطأ: لم يتم تحميل مكتبة الشطرنج. تأكد من اتصالك بالإنترنت.');
        }

        let game = null;
        let selectedSquare = null;
        let isThinking = false;

        // رموز القطع
        const pieceSymbols = {
            'wp': '♙', 'wn': '♘', 'wb': '♗', 'wr': '♖', 'wq': '♕', 'wk': '♔',
            'bp': '♟', 'bn': '♞', 'bb': '♝', 'br': '♜', 'bq': '♛', 'bk': '♚'
        };

        function initGame() {
            game = new Chess();
            selectedSquare = null;
            isThinking = false;
            renderBoard();
            checkGameOver();
        }

        function renderBoard() {
            const boardElement = document.getElementById('board');
            boardElement.innerHTML = '';
            const boardState = game.board();

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const file = String.fromCharCode(97 + c);
                    const rank = 8 - r;
                    const squareName = file + rank;

                    const squareDiv = document.createElement('div');
                    squareDiv.className = 'square ' + ((r + c) % 2 === 0 ? 'light' : 'dark');
                    squareDiv.dataset.square = squareName;

                    const piece = boardState[r][c];
                    if (piece) {
                        const pieceSpan = document.createElement('span');
                        const pieceKey = piece.color + piece.type;
                        pieceSpan.textContent = pieceSymbols[pieceKey];
                        pieceSpan.className = piece.color === 'w' ? 'piece-white' : 'piece-black';
                        squareDiv.appendChild(pieceSpan);
                    }

                    squareDiv.addEventListener('click', () => handleSquareClick(squareName));
                    boardElement.appendChild(squareDiv);
                }
            }
            updateHighlights();
        }

        function handleSquareClick(square) {
            if (isThinking || game.game_over() || game.turn() !== 'w') return;

            const piece = game.get(square);

            if (!selectedSquare) {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                }
                return;
            }

            const moves = game.moves({ square: selectedSquare, verbose: true });
            const move = moves.find(m => m.to === square);

            if (move) {
                game.move({ from: selectedSquare, to: square, promotion: 'q' });
                selectedSquare = null;
                renderBoard();
                
                if (checkGameOver()) return;

                isThinking = true;
                document.getElementById('status').textContent = 'الكمبيوتر يفكر...';
                setTimeout(makeComputerMove, 300);
            } else {
                if (piece && piece.color === 'w') {
                    selectedSquare = square;
                    renderBoard();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        }

        function updateHighlights() {
            document.querySelectorAll('.square').forEach(sq => {
                sq.classList.remove('selected', 'valid-move', 'valid-capture');
            });

            if (!selectedSquare) return;

            const selectedDiv = document.querySelector(`[data-square="${selectedSquare}"]`);
            if (selectedDiv) selectedDiv.classList.add('selected');

            const moves = game.moves({ square: selectedSquare, verbose: true });
            moves.forEach(m => {
                const targetDiv = document.querySelector(`[data-square="${m.to}"]`);
                if (targetDiv) {
                    if (m.flags.includes('c') || m.flags.includes('e')) {
                        targetDiv.classList.add('valid-capture');
                    } else {
                        targetDiv.classList.add('valid-move');
                    }
                }
            });
        }

        function makeComputerMove() {
            if (!game) return;
            const moves = game.moves();
            if (moves.length === 0) return;

            let bestMove = null;
            let bestValue = -9999;
            const pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

            moves.forEach(move => {
                game.move(move);
                let boardValue = 0;
                game.board().forEach(row => {
                    row.forEach(piece => {
                        if (piece) {
                            let val = pieceValues[piece.type];
                            boardValue += piece.color === 'b' ? val : -val;
                        }
                    });
                });
                game.undo();

                boardValue += Math.random() * 10;

                if (boardValue > bestValue) {
                    bestValue = boardValue;
                    bestMove = move;
                }
            });

            game.move(bestMove);
            isThinking = false;
            selectedSquare = null;
            renderBoard();
            checkGameOver();
        }

        function checkGameOver() {
            if (!game) return false;
            if (game.in_checkmate()) {
                const winner = game.turn() === 'w' ? 'الأسود' : 'الأبيض';
                document.getElementById('status').textContent = `كش مات! ${winner} فاز`;
                document.getElementById('win-title').textContent = winner === 'الأبيض' ? '🏆 فوز ساحق!' : '💀 خسارة';
                document.getElementById('win-screen').style.display = 'flex';
                return true;
            } else if (game.in_draw()) {
                document.getElementById('status').textContent = 'تعادل!';
                document.getElementById('win-title').textContent = '🤝 تعادل';
                document.getElementById('win-screen').style.display = 'flex';
                return true;
            } else if (game.in_check()) {
                document.getElementById('status').textContent = game.turn() === 'w' ? 'كش! دورك' : 'كش! الكمبيوتر';
            } else {
                document.getElementById('status').textContent = game.turn() === 'w' ? 'دورك (الأبيض)' : 'الكمبيوتر...';
            }
            return false;
        }

        function startGame() {
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            document.getElementById('win-screen').style.display = 'none';
            initGame();
        }

        function exitGame() {
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('main-menu').style.display = 'block';
        }
    </script>
</body>
</html>
