<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج 3D</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* --- الواجهة الرئيسية (الصورة والأزرار) --- */
        #menu-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            background-color: #000;
        }

        #menu-image {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            object-fit: contain;
        }

        .hotspot {
            position: absolute;
            cursor: pointer;
            border: none;
            outline: none;
            background-color: rgba(255, 0, 0, 0); /* شفافة */
            transition: background-color 0.2s;
        }

        /* أماكن الأزرار (ممكن تعدلها بزر التعديل الأخضر) */
        #btn-settings { top: 2%; left: 2%; width: 15%; height: 10%; }
        #btn-friends { bottom: 10%; left: 5%; width: 42%; height: 18%; }
        #btn-computer { bottom: 10%; right: 5%; width: 42%; height: 18%; }

        /* زر التعديل (لرؤية الأزرار) */
        #debug-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: #00ff00;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0.5;
        }

        /* --- شاشة اللعبة --- */
        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: radial-gradient(circle, #2a2a2a, #000);
            perspective: 1000px; /* سر تأثير الـ 3D */
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        
        /* الرقعة: مربعة ومائلة للخلف قليلاً (تأثير 3D) */
        .board-3d {
            width: 90vmin; /* يتناسب مع حجم الشاشة */
            height: 90vmin;
            max-width: 500px;
            max-height: 500px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            
            /* ميلان بسيط للخلف يعطي شكل القاعدة 3D */
            transform: rotateX(25deg); 
            
            box-shadow: 0 30px 60px rgba(0,0,0,0.9);
            border: 10px solid #3e2723; /* إطار خشبي */
            border-radius: 5px;
            background-color: #3e2723;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }
        .square.white { background-color: #f0d9b5; }
        .square.black { background-color: #b58863; }

        /* البيادق: 2D وواقفة عكس ميلان الرقعة لتظهر بشكل مستقيم */
        .piece-2d {
            font-size: 7vmin; /* حجم البيادق */
            transform: rotateX(-25deg); /* عكس ميلان الرقعة */
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            user-select: none;
            transition: transform 0.2s;
        }
        .square:hover .piece-2d {
            transform: rotateX(-25deg) scale(1.1); /* تكبير بسيط عند التحديد */
        }

        /* زر العودة */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 12px 25px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            z-index: 100;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        /* نافذة الإعدادات */
        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 3000;
            color: white;
            text-align: center;
            width: 250px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        #settings-modal h2 { margin-top: 0; color: #ffd700; }
        .setting-row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px; }
        .close-btn { margin-top: 15px; padding: 10px; background: #d500f9; color: white; border: none; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <!-- موسيقى الخلفية -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=chess-think-110112.mp3" type="audio/mpeg">
    </audio>

    <!-- زر التعديل (للتجربة فقط) -->
    <button id="debug-btn" onclick="toggleDebug()">تعديل الأزرار</button>

    <!-- 1. الواجهة الرئيسية -->
    <div id="menu-wrapper">
        <img id="menu-image" src="menu.png" alt="القائمة">
        <!-- الأزرار الشفافة فوق الصورة -->
        <button class="hotspot" id="btn-settings" onclick="openSettings()"></button>
        <button class="hotspot" id="btn-friends" onclick="startGame()"></button>
        <button class="hotspot" id="btn-computer" onclick="startGame()"></button>
    </div>

    <!-- 2. شاشة اللعبة -->
    <div id="game-container">
        <button class="back-btn" onclick="goBack()">عودة للقائمة</button>
        <div class="board-3d" id="chessboard"></div>
    </div>

    <!-- 3. نافذة الإعدادات -->
    <div id="settings-modal">
        <h2>الإعدادات</h2>
        <div class="setting-row">
            <span>الموسيقى</span>
            <input type="checkbox" id="music-toggle" checked onchange="toggleMusic()">
        </div>
        <div class="setting-row">
            <span>صوت النقر</span>
            <input type="checkbox" id="sfx-toggle" checked>
        </div>
        <button class="close-btn" onclick="closeSettings()">إغلاق</button>
    </div>

    <script>
        // --- الأصوات ---
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2;
        let audioCtx;

        function playClick() {
            if (!document.getElementById('sfx-toggle').checked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        document.body.addEventListener('click', function initAudio() {
            if(document.getElementById('music-toggle').checked) bgMusic.play().catch(e => {});
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.body.removeEventListener('click', initAudio);
        }, { once: true });

        function toggleMusic() {
            if(document.getElementById('music-toggle').checked) bgMusic.play();
            else bgMusic.pause();
        }

        // --- الإعدادات ---
        function openSettings() { playClick(); document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettings() { playClick(); document.getElementById('settings-modal').style.display = 'none'; }

        // --- وضع التعديل (رؤية الأزرار) ---
        let isDebug = false;
        function toggleDebug() {
            isDebug = !isDebug;
            const hotspots = document.querySelectorAll('.hotspot');
            const colors = ['rgba(255, 0, 0, 0.5)', 'rgba(0, 255, 0, 0.5)', 'rgba(0, 0, 255, 0.5)'];
            hotspots.forEach((btn, index) => {
                btn.style.backgroundColor = isDebug ? colors[index] : 'rgba(255, 0, 0, 0)';
            });
        }

        // --- توليد الرقعة ---
        const boardElement = document.getElementById('chessboard');
        const pieces2D = { 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙' };
        
        // ترتيب الرقعة الحقيقي
        const initialBoard = [
            ['r','n','b','q','k','b','n','r'], 
            ['p','p','p','p','p','p','p','p'], 
            ['','','','','','','',''], 
            ['','','','','','','',''],
            ['','','','','','','',''], 
            ['','','','','','','',''], 
            ['P','P','P','P','P','P','P','P'], 
            ['R','N','B','Q','K','B','N','R']
        ];

        function createBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    
                    const pieceCode = initialBoard[row][col];
                    if (pieceCode !== '') {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = 'piece-2d';
                        pieceDiv.innerText = pieces2D[pieceCode];
                        // تلوين البيادق (أبيض وأسود)
                        pieceDiv.style.color = (pieceCode === pieceCode.toLowerCase()) ? '#111' : '#fff';
                        square.appendChild(pieceDiv);
                    }
                    square.addEventListener('click', playClick);
                    boardElement.appendChild(square);
                }
            }
        }

        // --- التنقل بين الشاشات ---
        function startGame() {
            playClick();
            document.getElementById('menu-wrapper').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            createBoard(); // بناء الرقعة عند الدخول
        }

        function goBack() {
            playClick();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-wrapper').style.display = 'flex';
        }
    </script>
</body>
</html>
