<head>
<meta charset="UTF-8">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:radial-gradient(circle at top,#44205e,#160e29 65%,#090b18);
 color:white;
 font-family:Cairo,Arial,sans-serif;
 text-align:center;
 min-height:100vh;
}

header{
 padding:20px 10px 12px;
 background:linear-gradient(135deg,#301647,#17132c);
 border-bottom:2px solid #d4af37;
 box-shadow:0 5px 25px #0009;
}

h1{
 margin:0;
 font-size:clamp(23px,6vw,38px);
 color:#ffd66b;
 text-shadow:0 0 15px #ffba35;
}

.subtitle{
 color:#d8b7f0;
 font-size:13px;
}

.section{
 width:min(95%,850px);
 margin:22px auto;
 padding:20px 14px;
 border:1px solid #a77bba66;
 border-radius:22px;
 background:linear-gradient(145deg,#ffffff12,#ffffff04);
 box-shadow:0 10px 35px #0007,inset 0 0 20px #9b59b622;
}

.section-title{
 color:#ffd66b;
 font-size:18px;
 font-weight:900;
 margin:10px 0 18px;
 text-shadow:0 0 10px #d4af37;
}

.buttons{
 display:flex;
 flex-wrap:wrap;

 gap:12px;
}

.btn{
 position:relative;
 overflow:hidden;

 border:2px solid #f3d06e;
 border-radius:13px;
 min-width:135px;
 padding:13px 18px;
 color:white;

 font-size:15px;
 text-shadow:0 2px 4px #0009;
 box-shadow:inset 0 3px 5px #ffffff66,
 inset 0 -5px 8px #0007,
 0 6px 12px #0008;
 transition:.15s;
}

.btn:before{
 content:"";
 position:absolute;
 top:0;
 left:10%;
 width:80%;
 height:45%;
 background:linear-gradient(#ffffff55,transparent);
 border-radius:0 0 50% 50%;
 pointer-events:none;
}

.btn:active{
 transform:translateY(4px);
 box-shadow:inset 0 3px 8px #0009;
}

.gold{background:linear-gradient(#ffe477,#c18b16,#80530a);color:#402500}
.green{background:linear-gradient(#42e99a,#17945b,#07502f)}
.purple{background:linear-gradient(#c37ad7,#7435a4,#38145d)}
.blue{background:linear-gradient(#55baff,#2377b9,#12416e)}
.red{background:linear-gradient(#ff6868,#c52727,#750c0c)}
.orange{background:linear-gradient(#ffb34a,#ce600e,#753000)}

.large{
 width:min(90%,340px);
 padding:18px;
 font-size:22px;
 border-radius:35px;
}

.small{min-width:110px;font-size:13px;padding:10px}

#gameScreen{display:none}

#game{
 width:100%;
 height:55vh;
 min-height:340px;
 max-height:620px;
 touch-action:none;
 overflow:hidden;
 border-radius:15px;
}

#game canvas{display:block}

.game-panel{
 width:min(96%,800px);
 margin:15px auto;
 padding:13px;
 background:#211632;
 border:1px solid #a77bba77;
 border-radius:18px;
}

#status{
 color:#8ee7ff;
 font-weight:900;
 font-size:16px;
 margin:10px;
}

#moves{
 max-height:65px;
 overflow:auto;
 color:#ddd;
 font-size:12px;
 overflow-wrap:anywhere;
 margin-top:12px;
}

select{
 background:#302044;
 color:white;
 border:1px solid #d4af37;
 border-radius:10px;
 padding:10px;
 font-family:inherit;
 font-weight:bold;
}

#promotion{
 display:none;
 padding:12px;
 background:#37244d;
 border-radius:12px;
 margin:10px;
}

#settings{
 display:none;
 position:fixed;
 inset:0;
 z-index:10;
 background:#000b;
 justify-content:center;
 align-items:center;
 padding:15px;
}

.modal{
 width:min(95%,400px);
 background:linear-gradient(145deg,#49245e,#1a102b);
 border:2px solid #d4af37;
 border-radius:20px;
 padding:22px;
 box-shadow:0 0 35px #000;
}

.setting-row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 padding:12px 0;
 border-bottom:1px solid #ffffff22;
}

input[type=checkbox]{width:22px;height:22px;accent-color:#d4af37}

#notice{
 color:#ffd66b;
 min-height:25px;
 font-size:13px;
 margin:8px;
}

.footer{
 color:#a995b9;
 font-size:11px;
 padding:15px;
}
</style>
</head>

<body>

</div>

<input type="checkbox" id="effects" checked>
</div>

يمكنك تغيير الإعدادات أثناء اللعب.

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "OrbitControls":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/controls/OrbitControls.js",
  "chess":"https://cdn.jsdelivr.net/npm/chess.js@1.4.0/dist/esm/chess.js"
 }

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "OrbitControls";
import {Chess} from "chess";

const chess=new Chess();
const holder=document.getElementById("game");

let selected=null;
let thinking=false;
let pendingPromotion=null;
let snapshots=[];
let gameStarted=false;
let initialized=false;

const files="abcdefgh";

function position(square){
 return {
  x:files.indexOf(square[0])-3.5,
  z:Number(square[1])-4.5
 };
}

function sound(){
 if(!document.getElementById("sound").checked)return;

 try{
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(!AudioContext)return;

  const ctx=new AudioContext();
  const osc=ctx.createOscillator();
  const gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value=650;
  gain.gain.setValueAtTime(.07,ctx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);

  osc.start();
  osc.stop(ctx.currentTime+.12);
  osc.onended=()=>ctx.close();
 }catch(e){}
}

function notice(msg){
 document.getElementById("notice").textContent=msg;
}

window.comingSoon=function(name){
 sound();
 notice("✨ "+name+" - قريباً في تحديث جديد!");
};

window.openSettings=function(){
 sound();
 document.getElementById("settings").style.display="flex";
};

window.closeSettings=function(){
 sound();
 document.getElementById("settings").style.display="none";
};

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x151126);

const camera=new THREE.PerspectiveCamera(45,1,.1,100);
camera.position.set(7,9,11);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;

holder.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,0,0);
controls.enableDamping=true;
controls.enablePan=false;
controls.minDistance=8;
controls.maxDistance=16;
controls.maxPolarAngle=Math.PI/2.15;

scene.add(new THREE.HemisphereLight(0xffffff,0x303040,2));

const sun=new THREE.DirectionalLight(0xffffff,3);
sun.position.set(5,10,7);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
scene.add(sun);

const floor=new THREE.Mesh(
 new THREE.PlaneGeometry(200,200),
 new THREE.MeshStandardMaterial({color:0x101020})
);
floor.rotation.x=-Math.PI/2;
floor.position.y=-.7;
scene.add(floor);

// قاعدة الشطرنج
const base=new THREE.Mesh(
 new THREE.BoxGeometry(8.7,.65,8.7),
 new THREE.MeshStandardMaterial({
  color:0x29213e,
  metalness:.5,
  roughness:.35
 })
);
base.position.y=-.4;
base.receiveShadow=true;
scene.add(base);

const board=new THREE.Group();
scene.add(board);

const pieces=new THREE.Group();
scene.add(pieces);

const squares=[];

function makeBoard(){
 for(let rank=8;rank>=1;rank--){
  for(let f=0;f<8;f++){
   const s=files[f]+rank;
   const p=position(s);

   const mat=new THREE.MeshStandardMaterial({
    color:(rank+f)%2?0x936343:0xe9d2a5,
    roughness:.8
   });

   const mesh=new THREE.Mesh(
    new THREE.BoxGeometry(.99,.15,.99),
    mat
   );

   mesh.position.set(p.x,-.035,p.z);
   mesh.receiveShadow=true;
   mesh.userData.square=s;

   board.add(mesh);
   squares.push(mesh);
  }
 }
}

// تصميم ومجسّمات الوحوش المنحوتة ثلاثية الأبعاد
function monster(type,color){
 const g=new THREE.Group();

 const isWhite = color === "w";
 
 const mainMat = new THREE.MeshStandardMaterial({
  color: isWhite ? 0x28bca7 : 0x7c3aed,
  roughness: .35,
  metalness: .25
 });

 const accentMat = new THREE.MeshStandardMaterial({
  color: isWhite ? 0xffd66b : 0xff4757,
  metalness: .7,
  roughness: .2
 });

 const eyeMat = new THREE.MeshStandardMaterial({
  color: isWhite ? 0xffffff : 0xff2e93,
  emissive: isWhite ? 0x000000 : 0xaa0044,
  roughness: .1
 });

 const pupilMat = new THREE.MeshStandardMaterial({ color: 0x0f0f15 });
 const baseMetal = new THREE.MeshStandardMaterial({ color: 0x332244, metalness: .8, roughness: .2 });

 function addMesh(geo, mat, x, y, z, rx=0, ry=0, rz=0, sx=1, sy=1, sz=1){
  const m = new THREE.Mesh(geo, mat);
  m.position.set(x, y, z);
  m.rotation.set(rx, ry, rz);
  m.scale.set(sx, sy, sz);
  m.castShadow = true;
  m.receiveShadow = true;
  g.add(m);
  return m;
 }

 // 1. القاعدة الختمية لجميع الوحوش
 addMesh(new THREE.CylinderGeometry(.38, .42, .12, 16), baseMetal, 0, .06, 0);

 // 2. البيدق (Pawn): وحش الـ Cyclops (العين الواحدة الصغير)
 if(type === "p"){
  // الجسم والبدن
  addMesh(new THREE.SphereGeometry(.28, 16, 16), mainMat, 0, .32, 0, 0,0,0, 1, 1.1, 1);
  addMesh(new THREE.SphereGeometry(.22, 16, 16), mainMat, 0, .58, 0);
  
  // قرنان صغيران
  addMesh(new THREE.ConeGeometry(.06, .22, 8), accentMat, -.1, .78, 0, 0, 0, .3);
  addMesh(new THREE.ConeGeometry(.06, .22, 8), accentMat, .1, .78, 0, 0, 0, -.3);

  // عين وسطى عملاقة
  addMesh(new THREE.SphereGeometry(.1, 12, 12), eyeMat, 0, .6, .17);
  addMesh(new THREE.SphereGeometry(.04, 12, 12), pupilMat, 0, .6, .25);

  // يدين حادرتين
  addMesh(new THREE.SphereGeometry(.08, 10, 10), mainMat, -.23, .35, 0);
  addMesh(new THREE.SphereGeometry(.08, 10, 10), mainMat, .23, .35, 0);
 }

 // 3. القلعة (Rook): وحش الصخرة / الغول المصفح (Golem)
 else if(type === "r"){
  // أكتاف وجذع ضخم
  addMesh(new THREE.BoxGeometry(.58, .4, .45), mainMat, 0, .28, 0);
  addMesh(new THREE.BoxGeometry(.48, .35, .4), mainMat, 0, .58, 0);
  
  // رأس قلعة درعي
  addMesh(new THREE.CylinderGeometry(.28, .24, .3, 8), mainMat, 0, .85, 0);
  // شرفات التاج الصخري
  for(let i=0; i<4; i++){
   const ang = (i * Math.PI) / 2;
   addMesh(new THREE.BoxGeometry(.1, .12, .1), accentMat, Math.cos(ang)*.2, 1.02, Math.sin(ang)*.2);
  }

  // عيوان حمراوان/مضيئتان غاضبتان
  addMesh(new THREE.BoxGeometry(.08, .04, .05), eyeMat, -.1, .62, .19);
  addMesh(new THREE.BoxGeometry(.08, .04, .05), eyeMat, .1, .62, .19);

  // قبضات صخرية
  addMesh(new THREE.BoxGeometry(.16, .25, .16), accentMat, -.34, .32, 0);
  addMesh(new THREE.BoxGeometry(.16, .25, .16), accentMat, .34, .32, 0);
 }

 // 4. الحصان (Knight): الوحش المجنح / رأس التنين
 else if(type === "n"){
  // الجسم والرقبة المائلة للأمام
  addMesh(new THREE.CylinderGeometry(.2, .32, .45, 12), mainMat, 0, .28, 0);
  addMesh(new THREE.CylinderGeometry(.16, .22, .45, 12), mainMat, 0, .58, .1, .35, 0, 0);

  // رأس التنين
  addMesh(new THREE.BoxGeometry(.22, .2, .38), mainMat, 0, .78, .22, -.15, 0, 0);
  // فك التنين السفلي
  addMesh(new THREE.BoxGeometry(.18, .08, .28), accentMat, 0, .7, .25);

  // أذنان / قرون ممطوطة للخلف
  addMesh(new THREE.ConeGeometry(.06, .35, 8), accentMat, -.1, .92, 0, -.6, 0, -.2);
  addMesh(new THREE.ConeGeometry(.06, .35, 8), accentMat, .1, .92, 0, -.6, 0, .2);

  // عيون التنين
  addMesh(new THREE.SphereGeometry(.05, 10, 10), eyeMat, -.11, .82, .25);
  addMesh(new THREE.SphereGeometry(.05, 10, 10), eyeMat, .11, .82, .25);
 }

 // 5. الفيل (Bishop): الساحر / الكاهن الأسطوري
 else if(type === "b"){
  // الرداء والجسد النحيف الطويل
  addMesh(new THREE.CylinderGeometry(.16, .35, .65, 12), mainMat, 0, .38, 0);
  addMesh(new THREE.SphereGeometry(.22, 14, 14), mainMat, 0, .75, 0);

  // قبعة الساحر / قناع الفيل البيضاوي
  addMesh(new THREE.ConeGeometry(.18, .55, 12), accentMat, 0, 1.1, 0);
  
  // جوهرة سحرية عائمة فوق الرأس
  addMesh(new THREE.OctahedronGeometry(.1), eyeMat, 0, 1.48, 0);

  // عينان سحريتان عموديتان
  addMesh(new THREE.SphereGeometry(.045, 8, 8), eyeMat, -.08, .76, .18);
  addMesh(new THREE.SphereGeometry(.045, 8, 8), eyeMat, .08, .76, .18);
 }

 // 6. الملكة / الوزير (Queen): ملكة الوحوش التاجية
 else if(type === "q"){
  // جسد انسيابي ملكي
  addMesh(new THREE.CylinderGeometry(.18, .36, .7, 16), mainMat, 0, .4, 0);
  addMesh(new THREE.SphereGeometry(.24, 16, 16), mainMat, 0, .82, 0);

  // تاج ملكي خماسي الأشواك
  for(let i=0; i<5; i++){
   const ang = (i * Math.PI * 2) / 5;
   addMesh(new THREE.ConeGeometry(.05, .32, 8), accentMat, Math.cos(ang)*.18, 1.15, Math.sin(ang)*.18);
  }
  addMesh(new THREE.TorusGeometry(.18, .04, 8, 16), accentMat, 0, 1.02, 0, Math.PI/2, 0, 0);

  // عيون وأنياب ملكية
  addMesh(new THREE.SphereGeometry(.05, 10, 10), eyeMat, -.1, .85, .19);
  addMesh(new THREE.SphereGeometry(.05, 10, 10), eyeMat, .1, .85, .19);
  
  // أجنحة / أوشحة ظهرية
  addMesh(new THREE.BoxGeometry(.04, .45, .25), accentMat, -.22, .65, -.1, 0, -.3, -.3);
  addMesh(new THREE.BoxGeometry(.04, .45, .25), accentMat, .22, .65, -.1, 0, .3, .3);
 }

 // 7. الملك (King): لورد الوحوش الأعظم
 else if(type === "k"){
  // الهيكل والدروع الضخمة
  addMesh(new THREE.CylinderGeometry(.25, .38, .75, 16), mainMat, 0, .42, 0);
  addMesh(new THREE.SphereGeometry(.28, 16, 16), mainMat, 0, .88, 0);

  // القرون الذهبية الملكية الكبرى
  addMesh(new THREE.TorusGeometry(.26, .05, 8, 16), accentMat, 0, 1.12, 0, Math.PI/2, 0, 0);
  addMesh(new THREE.ConeGeometry(.08, .45, 8), accentMat, -.2, 1.3, 0, 0, 0, -.4);
  addMesh(new THREE.ConeGeometry(.08, .45, 8), accentMat, .2, 1.3, 0, 0, 0, .4);

  // جوهرة النصر العلوية
  addMesh(new THREE.SphereGeometry(.1, 12, 12), eyeMat, 0, 1.4, 0);

  // عينان شرستان ودرع صدر
  addMesh(new THREE.SphereGeometry(.06, 10, 10), eyeMat, -.11, .9, .22);
  addMesh(new THREE.SphereGeometry(.06, 10, 10), eyeMat, .11, .9, .22);
  addMesh(new THREE.BoxGeometry(.25, .25, .08), accentMat, 0, .52, .26);
 }

 return g;
}

function draw(){
 pieces.clear();

 const state=chess.board();

 for(let r=0;r<8;r++){
  for(let f=0;f<8;f++){
   const p=state[r][f];
   if(!p)continue;

   const s=files[f]+(8-r);
   const pos=position(s);

   const obj=monster(p.type,p.color);

   obj.position.set(pos.x,.05,pos.z);
   
   // تدوير القطع السوداء لـ تواجه اللاعب الأبيض
   if(p.color === "b"){
    obj.rotation.y = Math.PI;
   }

   obj.userData.square=s;
   obj.userData.color=p.color;

   pieces.add(obj);
  }
 }
}

function resetColors(){
 squares.forEach(s=>{
  const rank=Number(s.userData.square[1]);
  const f=files.indexOf(s.userData.square[0]);

  s.material.color.setHex(
   (rank+f)%2?0x936343:0xe9d2a5
  );
 });
}

function showMoves(from){
 resetColors();

 const moves=chess.moves({
  square:from,
  verbose:true
 });

 moves.forEach(m=>{
  const sq=squares.find(x=>x.userData.square===m.to);
  if(sq)sq.material.color.setHex(0x39dc83);
 });
}

function updateStatus(){
 const status=document.getElementById("status");

 if(chess.isCheckmate()){
  status.textContent="🏆 كش مات! "+(chess.turn()==="w"?"الأسود":"الأبيض")+" فاز!";
  return true;
 }

 if(chess.isStalemate()){
  status.textContent="🤝 تعادل بسبب الجمود!";
  return true;
 }

 if(chess.isDraw()){
  status.textContent="🤝 المباراة انتهت بالتعادل";
  return true;
 }

 if(chess.isCheck()){
  status.textContent="⚠️ كش! الملك مهدد";
  return false;
 }

 status.textContent=chess.turn()==="w"?
 "دورك الآن - الأبيض":"🤖 الكمبيوتر يفكر...";

 return false;
}

function saveMove(){

function evaluate(){
 if(chess.isCheckmate()){
  return chess.turn()==="w"?100000:-100000;
 }

 if(chess.isDraw())return 0;

 const values={
  p:100,n:320,b:330,r:500,q:900,k:20000
 };

 let score=0;

 chess.board().forEach((row,r)=>{
  row.forEach((p,f)=>{
   if(!p)return;

   let value=values[p.type];

   if(p.type==="p"){
    value+=(p.color==="b"?r:7-r)*4;
   }

   const center=7-(
    Math.abs(3.5-f)+Math.abs(3.5-r)
   );

   value+=center*2;
   score+=p.color==="b"?value:-value;
  });
 });

 return score;
}

 if(maximizing){
  let best=-Infinity;

  for(const m of moves){
   chess.move(m);

   best=Math.max(
    best,
    minimax(depth-1,alpha,beta,false)
   );

   chess.undo();

   alpha=Math.max(alpha,best);
   if(beta<=alpha)break;
  }

  return best;

 }else{
  let best=Infinity;

  for(const m of moves){
   chess.move(m);

   best=Math.min(
    best,
    minimax(depth-1,alpha,beta,true)
   );

   chess.undo();

   beta=Math.min(beta,best);
   if(beta<=alpha)break;
  }

  return best;
 }
}
