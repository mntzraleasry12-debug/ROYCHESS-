<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج 3D - القائمة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111;
        }

        #menu-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('menu.png');
            background-size: 100% 100%; /* لضمان تطابق الأزرار دائماً */
            background-position: center;
            z-index: 10;
        }

        /* المناطق الشفافة القابلة للنقر */
        .click-zone {
            position: absolute;
            cursor: pointer;
            border-radius: 15px;
            transition: 0.1s;
        }
        
        .click-zone:active { 
            transform: scale(0.96); 
            background: rgba(255,255,255,0.2); 
        }

        /* إحداثيات الأزرار */
        .btn-settings-zone { top: 2%; left: 3%; width: 12%; height: 6%; }
        .btn-friends-zone { top: 70%; left: 3%; width: 44%; height: 17%; }
        .btn-cpu-zone { top: 70%; right: 3%; width: 44%; height: 17%; }

        /* ================= قائمة الإعدادات ================= */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(8px);
        }

        .settings-modal {
            background: #1a1a1a;
            border: 3px solid #ffcc00;
            border-radius: 20px;
            width: 90%;
            max-width: 350px;
            padding: 25px;
            color: white;
            text-align: center;
        }

        .settings-modal h2 { color: #ffcc00; margin-bottom: 20px; }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #333;
        }

        .switch { position: relative; display: inline-block; width: 50px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #555; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #ffcc00; }
        input:checked + .slider:before { transform: translateX(24px); }

        .close-btn {
            background: #ffcc00; color: #000; border: none; padding: 12px;
            font-size: 18px; font-weight: bold; border-radius: 10px; cursor: pointer; width: 100%;
        }
    </style>
</head>
<body>

    <div id="menu-screen">
        <!-- عند النقر على الترس، تفتح الإعدادات -->
        <div class="click-zone btn-settings-zone" onclick="openSettings()"></div>
        
        <!-- عند النقر، ينتقل إلى اللعبة بوضع الأصدقاء -->
        <div class="click-zone btn-friends-zone" onclick="goToGame('friend')"></div>
        
        <!-- عند النقر، ينتقل إلى اللعبة بوضع الكمبيوتر -->
        <div class="click-zone btn-cpu-zone" onclick="goToGame('cpu')"></div>
    </div>

    <!-- قائمة الإعدادات الخاصة بالقائمة الرئيسية -->
    <div class="modal-overlay" id="settingsModal">
        <div class="settings-modal">
            <h2>⚙️ الإعدادات</h2>
            
            <div class="setting-item">
                <label>الموسيقى</label>
                <label class="switch">
                    <input type="checkbox" id="musicToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="setting-item">
                <label>صوت النقر</label>
                <label class="switch">
                    <input type="checkbox" id="sfxToggle" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <button class="close-btn" onclick="closeSettings()">حفظ وإغلاق</button>
        </div>
    </div>

    <script>
        // فتح وإغلاق الإعدادات
        function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }

        // الانتقال إلى ملف اللعبة مع تحديد الوضع (صديق أو كمبيوتر)
        function goToGame(mode) {
            // الانتقال إلى game.html مع تمرير المتغير mode في الرابط
            window.location.href = `game.html?mode=${mode}`;
        }
    </script>
</body>
</html>
