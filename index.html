<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>شطرنج 3D</title>
    <style>
        /* إعدادات الصفحة الأساسية */
        body {
            margin: 0;
            padding: 0;
            background-color: #000; /* خلفية سوداء لتملأ الفراغات */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        /* الحاوية التي تضم الصورة والأزرار */
        /* هذا الكود يضمن أن الصورة لا تتشوه أبداً وتحافظ على أبعادها */
        #menu-wrapper {
            position: relative;
            display: inline-block;
            height: 100%;
            max-height: 100vh;
        }

        /* الصورة */
        #menu-image {
            height: 100vh;
            width: auto;
            max-width: 100vw;
            display: block;
            object-fit: contain; /* يضمن عدم قص الصورة */
        }

        /* الأزرار الشفافة */
        .hotspot {
            position: absolute;
            cursor: pointer;
            border: none;
            outline: none;
            background-color: rgba(255, 0, 0, 0); /* شفافة */
            transition: background-color 0.2s;
        }

        /* 1. زر الترس (الإعدادات) */
        #btn-settings {
            top: 2%;
            left: 2%;
            width: 12%;
            height: 8%;
        }

        /* 2. زر تحدي الأصدقاء */
        #btn-friends {
            bottom: 10%;
            left: 5%;
            width: 42%;
            height: 18%;
        }

        /* 3. زر العب ضد الكمبيوتر */
        #btn-computer {
            bottom: 10%;
            right: 5%;
            width: 42%;
            height: 18%;
        }

        /* زر وهمي لتفعيل وضع التعديل (لمعرفة أماكن الأزرار) */
        #debug-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 9999;
            background: #00ff00;
            color: black;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 5px;
            font-size: 12px;
            opacity: 0.5;
        }

        /* --- باقي الإعدادات واللعبة --- */
        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 1000;
            color: white;
            text-align: center;
            width: 250px;
        }
        #settings-modal h2 { margin-top: 0; color: #ffd700; }
        .setting-row { display: flex; justify-content: space-between; margin: 15px 0; font-size: 18px; }
        .close-btn { margin-top: 15px; padding: 10px; background: #d500f9; color: white; border: none; border-radius: 10px; width: 100%; cursor: pointer; }

        #game-container {
            display: none;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            background: radial-gradient(circle, #1a1a1a, #000);
            perspective: 1200px;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        
        .board-3d {
            width: 320px;
            height: 320px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            transform: rotateX(45deg) rotateZ(45deg);
            box-shadow: -20px 20px 50px rgba(0,0,0,0.8);
            border: 5px solid #222;
            background-color: #222;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
            transform: rotateZ(-45deg) rotateX(-45deg);
            cursor: pointer;
        }
        .square.white { background-color: #f0d9b5; }
        .square.black { background-color: #b58863; }

        .piece-2d { font-size: 40px; user-select: none; }

        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- موسيقى الخلفية -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=chess-think-110112.mp3" type="audio/mpeg">
    </audio>

    <!-- زر التعديل (يمكنك حذفه لاحقاً إذا أردت) -->
    <button id="debug-btn" onclick="toggleDebug()">تعديل الأزرار</button>

    <!-- الواجهة -->
    <div id="menu-wrapper">
        <!-- الصورة الخاصة بك (تأكد أن اسمها menu.png) -->
        <img id="menu-image" src="menu.png" alt="القائمة">
        
        <!-- الأزرار الشفافة فوق الصورة -->
        <button class="hotspot" id="btn-settings" onclick="openSettings()"></button>
        <button class="hotspot" id="btn-friends" onclick="startGame('friends')"></button>
        <button class="hotspot" id="btn-computer" onclick="startGame('computer')"></button>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal">
        <h2>الإعدادات</h2>
        <div class="setting-row">
            <span>الموسيقى</span>
            <input type="checkbox" id="music-toggle" checked onchange="toggleMusic()">
        </div>
        <div class="setting-row">
            <span>صوت النقر</span>
            <input type="checkbox" id="sfx-toggle" checked>
        </div>
        <button class="close-btn" onclick="closeSettings()">إغلاق</button>
    </div>

    <!-- اللعبة -->
    <div id="game-container">
        <button class="back-btn" onclick="goBack()">عودة</button>
        <div class="board-3d" id="chessboard"></div>
    </div>

    <script>
        // --- أصوات ---
        const bgMusic = document.getElementById('bg-music');
        bgMusic.volume = 0.2;
        let audioCtx;

        function playClick() {
            if (!document.getElementById('sfx-toggle').checked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        document.body.addEventListener('click', function initAudio() {
            if(document.getElementById('music-toggle').checked) bgMusic.play().catch(e => {});
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.body.removeEventListener('click', initAudio);
        }, { once: true });

        function toggleMusic() {
            if(document.getElementById('music-toggle').checked) bgMusic.play();
            else bgMusic.pause();
        }

        // --- الإعدادات ---
        function openSettings() { playClick(); document.getElementById('settings-modal').style.display = 'block'; }
        function closeSettings() { playClick(); document.getElementById('settings-modal').style.display = 'none'; }

        // --- وضع التعديل (لرؤية الأزرار) ---
        let isDebug = false;
        function toggleDebug() {
            isDebug = !isDebug;
            const hotspots = document.querySelectorAll('.hotspot');
            const colors = ['rgba(255, 0, 0, 0.5)', 'rgba(0, 255, 0, 0.5)', 'rgba(0, 0, 255, 0.5)'];
            hotspots.forEach((btn, index) => {
                btn.style.backgroundColor = isDebug ? colors[index] : 'rgba(255, 0, 0, 0)';
            });
        }

        // --- الرقعة والبيادق ---
        const boardElement = document.getElementById('chessboard');
        const pieces2D = { 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙' };
        const initialBoard = [
            ['r','n','b','q','k','b','n','r'], ['p','p','p','p','p','p','p','p'], ['','','','','','','',''], ['','','','','','','',''],
            ['','','','','','','',''], ['','','','','','','',''], ['P','P','P','P','P','P','P','P'], ['R','N','B','Q','K','B','N','R']
        ];

        function createBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    const pieceCode = initialBoard[row][col];
                    if (pieceCode !== '') {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = 'piece-2d';
                        pieceDiv.innerText = pieces2D[pieceCode];
                        pieceDiv.style.color = (pieceCode === pieceCode.toLowerCase()) ? '#000' : '#fff';
                        square.appendChild(pieceDiv);
                    }
                    square.addEventListener('click', playClick);
                    boardElement.appendChild(square);
                }
            }
        }

        // --- تشغيل اللعبة والعودة ---
        function startGame(mode) {
            playClick();
            document.getElementById('menu-wrapper').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            createBoard(); 
        }

        function goBack() {
            playClick();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('menu-wrapper').style.display = 'block';
        }
    </script>
</body>
</html>
