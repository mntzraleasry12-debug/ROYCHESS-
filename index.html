
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chess 3D Controls</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#000;
}
.game {
  position:relative;
  width:100%;
  max-width:1024px;
  margin:auto;
  overflow:hidden;
}
.game img {
  display:block;
  width:100%;
  height:auto;
}
.btn {
  position:absolute;
  border:0;
  background:transparent;
  cursor:pointer;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}
.btn:active {
  background:#ffffff18;
  border-radius:15px;
}
</style>
</head>
<body>

<div class="game">
<img src="واجهة.png" alt="Chess 3D">

<!-- الأزرار العلوية -->
<button class="btn" style="left:2%;top:1%;width:10%;height:7%" onclick="control('settings')" aria-label="الإعدادات"></button>
<button class="btn" style="left:12%;top:1%;width:11%;height:7%" onclick="control('shop')" aria-label="المتجر"></button>
<button class="btn" style="left:24%;top:2%;width:24%;height:5%" onclick="control('coins')" aria-label="العملات"></button>
<button class="btn" style="left:50%;top:1%;width:28%;height:6%" onclick="control('gems')" aria-label="الجواهر"></button>
<button class="btn" style="left:82%;top:0%;width:17%;height:10%" onclick="control('profile')" aria-label="الملف الشخصي"></button>

<!-- الجانب -->
<button class="btn" style="left:1%;top:9%;width:19%;height:12%" onclick="control('tournament')" aria-label="البطولة"></button>
<button class="btn" style="left:82%;top:10%;width:17%;height:9%" onclick="control('ranking')" aria-label="الترتيب"></button>
<button class="btn" style="left:83%;top:19%;width:16%;height:10%" onclick="control('heroes')" aria-label="لوحة الأبطال"></button>

<!-- أزرار اللعب -->
<button class="btn" style="left:2%;top:48%;width:47%;height:18%" onclick="control('friends')" aria-label="تحدي الأصدقاء"></button>
<button class="btn" style="left:51%;top:48%;width:47%;height:18%" onclick="control('computer')" aria-label="اللعب ضد الكمبيوتر"></button>

<button class="btn" style="left:2%;top:67%;width:47%;height:19%" onclick="control('online')" aria-label="اللعب أونلاين"></button>
<button class="btn" style="left:51%;top:67%;width:47%;height:19%" onclick="control('quick')" aria-label="لعبة سريعة"></button>

<!-- الشريط السفلي -->
<button class="btn" style="left:1%;top:88%;width:20%;height:11%" onclick="control('store')" aria-label="المتجر"></button>
<button class="btn" style="left:21%;top:88%;width:19%;height:11%" onclick="control('inventory')" aria-label="المخزون"></button>
<button class="btn" style="left:40%;top:87%;width:21%;height:12%" onclick="control('home')" aria-label="الرئيسية"></button>
<button class="btn" style="left:61%;top:88%;width:19%;height:11%" onclick="control('statistics')" aria-label="الإحصائيات"></button>
<button class="btn" style="left:80%;top:88%;width:19%;height:11%" onclick="control('achievements')" aria-label="الإنجازات"></button>

</div>

<script>
function control(name) {
  console.log("Button:", name);

  // اربط كل زر بوظيفته هنا
  if(name === 'home') {
    console.log('الرئيسية');
  }
}
</script>

</body>
</html>
