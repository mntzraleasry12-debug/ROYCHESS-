<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شطرنج 3D</title>
    <style>
        /* إعدادات عامة */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(180deg, #004d00, #008000);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
        }

        /* زر الإعدادات */
        .settings-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ccc"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>') no-repeat center center;
            background-size: cover;
            cursor: pointer;
            z-index: 100;
            transition: transform 0.3s;
        }
        .settings-btn:hover { transform: rotate(90deg); }

        /* واجهة القائمة الرئيسية */
        #main-menu {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: 100%;
            justify-content: center;
            background: url('https://www.transparenttextures.com/patterns/stardust.png'); /* نسيج خفيف */
        }

        /* الشعار والدرع */
        .shield-container {
            position: relative;
            width: 300px;
            height: 250px;
            background: linear-gradient(180deg, #800000, #4a0000);
            border: 4px solid #ffd700;
            border-radius: 50% 50% 10px 10px / 60% 60% 10px 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 50px;
        }
        .shield-container h1 {
            color: #ffd700;
            font-size: 40px;
            margin: 0;
            text-shadow: 2px 2px 4px #000;
        }
        .shield-container span {
            color: #fff;
            font-size: 30px;
            font-weight: bold;
        }

        /* الأزرار */
        .buttons-container {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .game-btn {
            width: 160px;
            height: 120px;
            border-radius: 20px;
            border: 3px solid;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 15px;
            font-size: 16px;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px #000;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }
        .game-btn:active { transform: scale(0.95); }
        
        .btn-friends {
            background: linear-gradient(180deg, #d500f9, #7b1fa2);
            border-color: #e040fb;
            box-shadow: 0 0 15px #d500f9;
        }
        .btn-computer {
            background: linear-gradient(180deg, #ffb300, #ff6f00);
            border-color: #ffca28;
            box-shadow: 0 0 15px #ffb300;
        }

        /* الرموز داخل الأزرار */
        .icon-pawns { font-size: 40px; margin-bottom: 5px; }

        /* نافذة الإعدادات (Modal) */
        #settings-modal {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #222;
            border: 2px solid #ffd700;
            border-radius: 15px;
            padding: 20px;
            z-index: 1000;
            color: white;
            text-align: center;
            width: 250px;
        }
        #settings-modal h2 { margin-top: 0; color: #ffd700; }
        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 15px 0;
            font-size: 18px;
        }
        .close-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: #d500f9;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        /* منطقة اللعبة */
        #game-container {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            background: #1a1a1a;
            perspective: 1000px; /* لرؤية الرقعة ثلاثية الأبعاد */
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        
        /* الرقعة 3D */
        .board-3d {
            width: 400px;
            height: 400px;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            transform: rotateX(45deg) rotateZ(45deg); /* تحويل الرقعة لتبدو 3D */
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 5px solid #333;
        }

        .square {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            /* البيادق مسطحة 2D */
            transform: rotateZ(-45deg) rotateX(-45deg); 
            cursor: pointer;
        }
        .square.white { background-color: #f0d9b5; }
        .square.black { background-color: #b58863; }

        .piece-2d {
            font-size: 50px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            user-select: none;
        }

        /* زر العودة */
        .back-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* إخفاء الأصوات */
        audio { display: none; }
    </style>
</head>
<body>

    <!-- الأصوات -->
    <audio id="bg-music" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>
    <audio id="click-sound">
        <source src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" type="audio/ogg">
    </audio>

    <!-- زر الإعدادات -->
    <div class="settings-btn" onclick="openSettings()"></div>

    <!-- القائمة الرئيسية -->
    <div id="main-menu">
        <!-- الشعار -->
        <div class="shield-container">
            <h1>شطرنج</h1>
            <span>3D</span>
        </div>

        <!-- الأزرار -->
        <div class="buttons-container">
            <div class="game-btn btn-friends" onclick="startGame('friends')">
                <div class="icon-pawns">♟️♙</div>
                تحدي الأصدقاء
            </div>
            <div class="game-btn btn-computer" onclick="startGame('computer')">
                <div class="icon-pawns">🖥️♞</div>
                العب ضد الكمبيوتر
            </div>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal">
        <h2>الإعدادات</h2>
        <div class="setting-row">
            <span>الموسيقى</span>
            <input type="checkbox" id="music-toggle" checked onchange="toggleMusic()">
        </div>
        <div class="setting-row">
            <span>صوت النقر</span>
            <input type="checkbox" id="sfx-toggle" checked>
        </div>
        <button class="close-btn" onclick="closeSettings()">إغلاق</button>
    </div>

    <!-- حاوية اللعبة -->
    <div id="game-container">
        <button class="back-btn" onclick="goBack()">عودة</button>
        <div class="board-3d" id="chessboard">
            <!-- سيتم توليد الرقعة عبر الجافاسكريبت -->
        </div>
        <p style="color: white; margin-top: 50px; font-size: 20px;">جاري تطوير محرك اللعبة...</p>
    </div>

    <script>
        // --- إدارة الأصوات ---
        const bgMusic = document.getElementById('bg-music');
        const clickSound = document.getElementById('click-sound');
        
        // تشغيل الموسيقى تلقائياً (قد يمنعها المتصفح حتى يتفاعل المستخدم)
        bgMusic.volume = 0.3;
        
        document.body.addEventListener('click', function initAudio() {
            if(document.getElementById('music-toggle').checked) {
                bgMusic.play().catch(e => console.log("المتصفح منع تشغيل الصوت التلقائي"));
            }
            document.body.removeEventListener('click', initAudio);
        }, { once: true });

        function playClick() {
            if(document.getElementById('sfx-toggle').checked) {
                clickSound.currentTime = 0;
                clickSound.play().catch(e => console.log("خطأ في الصوت"));
            }
        }

        function toggleMusic() {
            if(document.getElementById('music-toggle').checked) {
                bgMusic.play();
            } else {
                bgMusic.pause();
            }
        }

        // --- الإعدادات ---
        function openSettings() {
            playClick();
            document.getElementById('settings-modal').style.display = 'block';
        }

        function closeSettings() {
            playClick();
            document.getElementById('settings-modal').style.display = 'none';
        }

        // --- توليد الرقعة (2D Pieces on 3D Board) ---
        const boardElement = document.getElementById('chessboard');
        // رموز القطع المسطحة 2D
        const pieces2D = {
            'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', // أسود
            'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙'  // أبيض
        };

        // الترتيب الابتدائي
        const initialBoard = [
            ['r','n','b','q','k','b','n','r'],
            ['p','p','p','p','p','p','p','p'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['P','P','P','P','P','P','P','P'],
            ['R','N','B','Q','K','B','N','R']
        ];

        function createBoard() {
            boardElement.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const square = document.createElement('div');
                    // تحديد لون المربع
                    square.className = `square ${(row + col) % 2 === 0 ? 'white' : 'black'}`;
                    
                    // إضافة القطعة إذا وجدت
                    const pieceCode = initialBoard[row][col];
                    if (pieceCode !== '') {
                        const pieceDiv = document.createElement('div');
                        pieceDiv.className = 'piece-2d';
                        pieceDiv.innerText = pieces2D[pieceCode];
                        
                        // تلوين القطع السوداء والبيضاء لتمييزها بشكل أفضل
                        if (pieceCode === pieceCode.toLowerCase()) {
                            pieceDiv.style.color = '#000';
                        } else {
                            pieceDiv.style.color = '#fff';
                        }
                        
                        square.appendChild(pieceDiv);
                    }
                    
                    // حدث النقر على المربع
                    square.addEventListener('click', () => {
                        playClick();
                        // هنا يمكنك إضافة منطق تحريك القطع لاحقاً
                    });

                    boardElement.appendChild(square);
                }
            }
        }

        // --- بدء اللعبة ---
        function startGame(mode) {
            playClick();
            document.getElementById('main-menu').style.display = 'none';
            document.getElementById('game-container').style.display = 'flex';
            createBoard(); // إنشاء الرقعة عند الدخول
            
            if(mode === 'computer') {
                console.log("بدأت اللعبة ضد الكمبيوتر");
                // هنا يتم ربط محرك شطرنج ذكي مثل Stockfish
            } else {
                console.log("بدأت لعبة التحدي مع الأصدقاء");
            }
        }

        // --- العودة للقائمة ---
        function goBack() {
            playClick();
            document.getElementById('game-container').style.display = 'none';
            document.getElementById('main-menu').style.display = 'flex';
        }
    </script>
</body>
</html>
